events {}
http {
    access_log off;
    server_tokens off;

    # Only the reader session belongs to the new application on this origin.
    map $cookie_tidepost_reader $reader_cookie {
        default "";
        "~^[a-f0-9]{64}$" "tidepost_reader=$cookie_tidepost_reader";
    }

    map $cookie_folio_reader $identity_cookie {
        default "";
        "~^[a-f0-9]{64}$" "folio_reader=$cookie_folio_reader";
    }
    map $cookie_folio_flow $flow_cookie {
        default "";
        "~^[a-f0-9]{64}$" "folio_flow=$cookie_folio_flow";
    }
    map $uri $app_cookie {
        /reader-auth/callback/wechat "$identity_cookie; $flow_cookie";
        default $reader_cookie;
        ~^/reader-auth/ $identity_cookie;
    }

    map $host $index_policy {
        default "";
        player-origin.codeiy.com "noindex, nofollow";
    }

    server {
        listen 127.0.0.1:14380;
        server_name www.codeiy.com player-origin.codeiy.com;
        add_header X-Robots-Tag $index_policy always;
        location ~* ^/(workbench|editor-api|editor-preview) { return 404; }
        location ~ ^/(api/auth/callback/(wechat|github)|billing/alipay-return)$ {
            if ($request_method != GET) { return 405; }
            add_header Cache-Control no-store always;
            add_header Referrer-Policy no-referrer always;
            return 302 https://r.codeiy.com$request_uri;
        }
        location = /folio-move { rewrite ^ /folio-move.html last; }
        # Previously distributed Folio mini-programs still use the www API base.
        location ^~ /api/wechat-mini/ {
            client_max_body_size 12m;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host r.codeiy.com;
            proxy_set_header Cookie "";
            proxy_pass https://r.codeiy.com;
        }
        location ^~ /guides/ {
            return 301 https://r.codeiy.com$request_uri;
        }
        # Exact Naruto catalog, generated from deploy/image-pilot/naruto.txt.
        location ~ ^/art/(?:episode-scenes/(?:31bbbc989c87ffeb580c6573fa76b45c94e1558b11711110664971137c04a126|6836b75085e8d0f6d803d847dcab880d8ca99655b31679e9d6a147f0f6b547e9|9a4688e2cf5c10a9a177daa3fcc5d1494bba47163ab4a9d0240939d9ec6cb2d9|b3e79a406e746228ff9c672001bdafdd704619a49b40412e762e1e2f662f7ce4|e01c2a40d49ba580027f8dc2f561639bdab451fd6b546eb68ebc04176ad84f26)\.jpg|portraits/(?:1fdd6c8f444c33de49e4f7f4df877e45e8916a4e2d320f560695c795f11cb1b9|35302859b063894a5b84001ecac7351e80ace673c99128a857efdaee764b7188|6a04e7b2e4d349ca6328f9558103fd24135466831d064fd7e055b6a6442da301|7a9ae6bc6b64d9d8b1dc429bd1414f53146673c84aec086c823cef7e765295c3|cdfa0455e170f2e639e5531f79a71d7f09a697ba3ecc520fb29a19a3f43d299f|d847fb941d87e1e76d432d2f36b43e808c33ff54619cea142585622416a0b419)\.webp)$ {
            limit_except GET { deny all; }
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 25s;
            proxy_force_ranges on;
            proxy_intercept_errors on;
            error_page 502 503 504 = @naruto_original;
            proxy_pass http://127.0.0.1:14581;
        }
        location @naruto_original {
            proxy_set_header Host www.codeiy.com;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_pass http://127.0.0.1:14310;
        }
        location ~ ^/image-preview/art/(?:episode-scenes/(?:31bbbc989c87ffeb580c6573fa76b45c94e1558b11711110664971137c04a126|6836b75085e8d0f6d803d847dcab880d8ca99655b31679e9d6a147f0f6b547e9|9a4688e2cf5c10a9a177daa3fcc5d1494bba47163ab4a9d0240939d9ec6cb2d9|b3e79a406e746228ff9c672001bdafdd704619a49b40412e762e1e2f662f7ce4|e01c2a40d49ba580027f8dc2f561639bdab451fd6b546eb68ebc04176ad84f26)\.jpg|portraits/(?:1fdd6c8f444c33de49e4f7f4df877e45e8916a4e2d320f560695c795f11cb1b9|35302859b063894a5b84001ecac7351e80ace673c99128a857efdaee764b7188|6a04e7b2e4d349ca6328f9558103fd24135466831d064fd7e055b6a6442da301|7a9ae6bc6b64d9d8b1dc429bd1414f53146673c84aec086c823cef7e765295c3|cdfa0455e170f2e639e5531f79a71d7f09a697ba3ecc520fb29a19a3f43d299f|d847fb941d87e1e76d432d2f36b43e808c33ff54619cea142585622416a0b419)\.webp)$ {
            limit_except GET { deny all; }
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            add_header Referrer-Policy no-referrer always;
            proxy_pass http://127.0.0.1:14581;
        }
        location / {
            proxy_set_header Host www.codeiy.com;
            proxy_set_header X-Forwarded-Host www.codeiy.com;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Cookie $app_cookie;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://127.0.0.1:14310;
        }
    }
}
