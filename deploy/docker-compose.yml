name: tidepost-knowledge
services:
  postgres:
    extends: {file: compose.services.yml, service: postgres}
  api:
    extends: {file: compose.services.yml, service: api}
  research-agent:
    extends: {file: compose.services.yml, service: research-agent}
  sync:
    extends: {file: compose.services.yml, service: sync}
    environment:
      OPS_NODE_NAME: ${OPS_NODE_NAME:?Set OPS_NODE_NAME in .env}
volumes:
  knowledge-data:
  research-state:
  media-assets:
  knowledge-archive:
