name: player-edge
services:
  nginx:
    build: {context: ../.., dockerfile: apps/web/Dockerfile, target: site}
    entrypoint: [nginx]
    command: [-c, /etc/folio-edge/nginx.conf, -g, "daemon off;"]
    restart: unless-stopped
    ports:
      - "${EDGE_BIND:-0.0.0.0}:${EDGE_HTTP_PORT:-80}:80"
      - "${EDGE_BIND:-0.0.0.0}:${EDGE_HTTPS_PORT:-443}:443"
    volumes:
      - ${EDGE_CONFIG_DIR:?rendered configuration}:/etc/folio-edge:ro
      - ${EDGE_TLS_DIR:?TLS certificate and key}:/etc/folio-tls:ro
      - ${EDGE_RELAY_DIR:?private relay directory}:/mesh:ro
      - image-cache:/var/cache/nginx
    healthcheck:
      test: ["CMD-SHELL", "nginx -t -q -c /etc/folio-edge/nginx.conf && test -s /usr/share/nginx/html/index.html"]
      interval: 20s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging: {driver: local}
volumes:
  image-cache:
