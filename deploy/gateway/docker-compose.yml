name: player-edge
services:
  nginx:
    image: nginx:stable-alpine@sha256:caf4e1e032a20f9c3c5e28fc7f25ffd768ad8677b4975c54193075997b3a97e3
    entrypoint: [nginx]
    command: [-c, /edge/current/nginx.conf, -g, "daemon off;"]
    network_mode: host
    user: "1000:1000"
    read_only: true
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: unless-stopped
    tmpfs: [/tmp]
    volumes:
      - /var/lib/player-edge/config:/edge:ro
      - /run/player-edge:/run/player-edge
      - /var/lib/player-edge/mesh:/mesh:ro
    logging:
      driver: local
