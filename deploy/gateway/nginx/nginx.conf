user ${NGINX_WORKER_USER};
worker_processes auto;
pid ${NGINX_PID};
error_log stderr warn;

events { worker_connections 2048; }

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    server_tokens off;
    ${TUNNEL_HTTP_CONFIG}
    sendfile on;
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json application/xml image/svg+xml;

    # Omit query strings, cookies and signed URL parameters from access logs.
    log_format edge '$remote_addr $host "$request_method $uri" $status bytes=$body_bytes_sent '
                    'upstream=$upstream_status cache=$upstream_cache_status rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout edge;

    ssl_certificate ${TLS_FULLCHAIN};
    ssl_certificate_key ${TLS_PRIVATE_KEY};
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:folio_tls:10m;
    ssl_session_tickets off;

    proxy_http_version 1.1;
    proxy_connect_timeout 3s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream off;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate ${UPSTREAM_CA_BUNDLE};

    upstream gin { server ${API_UPSTREAM}; keepalive 16; }
    upstream reader_api { server ${READER_API_UPSTREAM}; keepalive 16; }
    upstream guangzhou_image { server ${IMAGE_UPSTREAM}; keepalive 16; }
    proxy_cache_path ${IMAGE_CACHE_DIR} levels=1:2 keys_zone=folio_images:32m
                     max_size=2g inactive=7d use_temp_path=off;

    map $uri $site_cache {
        /index.html "no-cache, must-revalidate";
        "~^/assets/.+-[A-Za-z0-9_-]{8}\\.[A-Za-z0-9]+$" "public, max-age=31536000, immutable";
        default "";
    }
    map "$args|$http_authorization|$http_cookie|$http_range|$http_if_range" $image_bypass {
        "~(?:^|&)(?:sig|exp)(?:=|&|\\|)" 1;
        "~\\|[^|]+" 1;
        default 0;
    }
    map $upstream_http_cache_control $image_no_store {
        "~^public, max-age=[1-9][0-9]*(?:, immutable)?$" 0;
        default 1;
    }
    map "$uri:$status" $image_cache_control {
        "~^/(healthz|readyz):" "no-store";
        "~:[45][0-9][0-9]$" "no-store";
        default "";
    }
    limit_req_zone $binary_remote_addr zone=folio_reads:4m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=folio_login:4m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=folio_payment:4m rate=30r/s;
    limit_req_status 429;

    server {
        listen ${HTTP_LISTEN} default_server;
        server_name _;
        return 404;
    }
    server {
        listen ${HTTP_LISTEN};
        server_name ${PUBLIC_HOST} img.codeiy.com;
        return 308 https://$host$request_uri;
    }
    server {
        listen ${HTTPS_LISTEN} ssl default_server;
        ssl_reject_handshake on;
        return 404;
    }
    server {
        listen ${HTTPS_LISTEN} ssl;
        http2 on;
        server_name ${PUBLIC_HOST};
        root ${SITE_ROOT};

        ${TUNNEL_HTTPS_REDIRECT}
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Cache-Control $site_cache;

        client_max_body_size 1m;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        include ${CONFIG_DIR}/routes.conf;
    }
    server {
        listen ${HTTPS_LISTEN} ssl;
        http2 on;
        server_name img.codeiy.com;

        ${TUNNEL_HTTPS_REDIRECT}
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy no-referrer always;
        add_header Cross-Origin-Resource-Policy cross-origin always;
        add_header Access-Control-Allow-Origin "https://${PUBLIC_HOST}" always;
        add_header Access-Control-Expose-Headers "ETag, Accept-Ranges, Content-Range, X-Cache" always;
        add_header Cache-Control $image_cache_control always;
        add_header X-Cache $upstream_cache_status always;

        client_max_body_size 1k;
        proxy_pass_request_body off;
        proxy_set_header Content-Length "";
        proxy_set_header Host ${IMAGE_UPSTREAM_HOST};
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Forwarded "";
        proxy_set_header Connection "";
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_ssl_name ${IMAGE_UPSTREAM_HOST};

        location = /healthz { return 200 "ok\n"; }
        location = /readyz {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_pass ${IMAGE_UPSTREAM_SCHEME}://guangzhou_image;
        }
        location ~ "^/i/([a-f0-9]{64}|[a-f0-9]{8}(-[a-f0-9]{4}){3}-[a-f0-9]{12})$" {
            if ($request_method !~ ^(GET|HEAD)$) { return 405; }
            proxy_cache folio_images;
            proxy_cache_key "${IMAGE_UPSTREAM_SCHEME}://${IMAGE_UPSTREAM_HOST}$request_uri";
            proxy_cache_lock on;
            proxy_cache_bypass $image_bypass;
            proxy_no_cache $image_bypass $image_no_store;
            proxy_cache_valid 200 1h;
            proxy_intercept_errors on;
            error_page 502 503 504 = @image_unavailable;
            proxy_pass ${IMAGE_UPSTREAM_SCHEME}://guangzhou_image;
        }
        location @image_unavailable { return 503 "Image service unavailable\n"; }
        location / { return 404; }
    }
}
