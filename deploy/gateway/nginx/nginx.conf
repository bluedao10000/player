worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr notice;
events { worker_connections 2048; }
http {
    server_tokens off;
    client_body_temp_path /tmp/body;
    proxy_temp_path /tmp/proxy;
    fastcgi_temp_path /tmp/fastcgi;
    uwsgi_temp_path /tmp/uwsgi;
    scgi_temp_path /tmp/scgi;
    # Log the normalized path only. OAuth codes, signed URLs and tokens stay out of access logs.
    log_format edge '$remote_addr "$request_method $uri" $status bytes=$body_bytes_sent '
                    'upstream=$upstream_addr status=$upstream_status rt=$request_time urt=$upstream_response_time';
    access_log /dev/stdout edge;
    # Only cloudflared and operators can traverse the host origin socket directory.
    set_real_ip_from unix:;
    real_ip_header CF-Connecting-IP;
    map $http_upgrade $ws { default ""; ~*^websocket$ websocket; }
    map $ws $conn { default upgrade; "" ""; }
    map $cookie_folio_reader $identity { default ""; "~^[a-f0-9]{64}$" "folio_reader=$cookie_folio_reader"; }
    map $cookie_folio_flow $flow { default ""; "~^[a-f0-9]{64}$" "folio_flow=$cookie_folio_flow"; }
    map $uri $cookies {
        /reader-auth/callback/wechat "$identity; $flow";
        ~^/reader-auth/ $identity;
        default "";
    }
    map $uri $auth { ~^/(ios-account|api/wechat-mini)/ $http_authorization; default ""; }
    map $uri $mini_referer { ~^/api/wechat-mini/ $http_referer; default ""; }
    map $uri $origin_host { ~^/api/wechat-mini/ ${ACCOUNT_HOST}; default $host; }
    map $host $robots { www.codeiy.com ""; default "noindex, nofollow"; }
    limit_req_zone $binary_remote_addr zone=reads:4m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=login:4m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=payment:4m rate=30r/s;
    limit_req_status 429;
    include ${CONFIG_DIR}/upstreams.conf;
    server {
        listen unix:/run/player-edge/check.sock;
        location = / { return 200 "${RELEASE}"; }
        location / { return 404; }
    }
    server {
        listen unix:/run/player-edge/origin.sock default_server;
        server_name _;
        return 404;
    }
    server {
        listen unix:/run/player-edge/origin.sock;
        server_name ${PUBLIC_HOST};
        add_header X-Robots-Tag $robots always;
        proxy_http_version 1.1;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_next_upstream off;
        proxy_intercept_errors on;
        error_page 504 = @origin_timeout;
        proxy_connect_timeout 3s;
        proxy_send_timeout 60s;
        proxy_read_timeout 90s;
        client_max_body_size 1m;
        # Construct a new request header set. Nginx supplies body framing for the actual stream.
        proxy_pass_request_headers off;
        proxy_set_header Host $origin_host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Cookie $cookies;
        proxy_set_header Authorization $auth;
        proxy_set_header Accept $http_accept;
        proxy_set_header Accept-Encoding $http_accept_encoding;
        proxy_set_header Accept-Language $http_accept_language;
        proxy_set_header User-Agent $http_user_agent;
        proxy_set_header Content-Type $http_content_type;
        proxy_set_header Content-Encoding $http_content_encoding;
        proxy_set_header Referer $mini_referer;
        proxy_set_header Origin $http_origin;
        proxy_set_header Sec-Fetch-Site $http_sec_fetch_site;
        proxy_set_header X-Reader-ID $http_x_reader_id;
        proxy_set_header X-TSR-ServerFn $http_x_tsr_serverfn;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_set_header If-None-Match $http_if_none_match;
        proxy_set_header If-Modified-Since $http_if_modified_since;
        proxy_set_header Upgrade $ws;
        proxy_set_header Connection $conn;
        proxy_set_header Sec-WebSocket-Key $http_sec_websocket_key;
        proxy_set_header Sec-WebSocket-Version $http_sec_websocket_version;
        proxy_set_header Sec-WebSocket-Protocol $http_sec_websocket_protocol;
        proxy_set_header Last-Event-ID $http_last_event_id;
        include ${CONFIG_DIR}/routes.conf;
    }
}
