location = /healthz { return 200 "ok\n"; }
location = /readyz { try_files /index.html =503; }
location ~* ^/(workbench|editor-api|editor-preview|admin|art|i|v1)([/.\-]|$) { return 404; }

location ~ ^/(api/auth/callback/(wechat|github)|billing/alipay-return)$ {
    if ($request_method != GET) { return 405; }
    return 302 https://${ACCOUNT_HOST}$request_uri;
}
location ^~ /guides/ { return 301 https://${ACCOUNT_HOST}$request_uri; }
location ^~ /api/wechat-mini/ {
    limit_req zone=folio_login burst=30 nodelay;
    client_max_body_size 12m;
    proxy_set_header Host ${ACCOUNT_HOST};
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header Forwarded "";
    proxy_set_header Cookie "";
    proxy_ssl_name ${ACCOUNT_HOST};
    proxy_pass https://${ACCOUNT_HOST};
}

location = /api/billing/alipay/notify {
    if ($request_method != POST) { return 405; }
    limit_req zone=folio_payment burst=100 nodelay;
    proxy_pass http://reader_api;
}
location ~ ^/(reader-auth|ios-account)/ {
    limit_req zone=folio_login burst=30 nodelay;
    proxy_pass http://reader_api;
}
location ^~ /ios-data/ {
    limit_req zone=folio_reads burst=100 nodelay;
    proxy_pass http://reader_api;
}
location ~ ^/(robots\.txt|sitemap\.xml)$ { proxy_pass http://reader_api; }

location ~ "^/api/v1/knowledge/(discovery|works(/[0-9a-fA-F-]{36})?|worlds(/[a-z0-9-]+(/(characters|chapters|scenes)/[a-z0-9-]+)?)?)$" {
    if ($request_method !~ ^(GET|HEAD)$) { return 405; }
    limit_req zone=folio_reads burst=100 nodelay;
    proxy_set_header Host $host;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto https;
    proxy_pass http://gin;
}
location ~* ^/(api|reader-auth|ios-account|ios-data)(/|$) { return 404; }
location ^~ /assets/ { try_files $uri =404; }
location = /index.html { try_files $uri =404; }
location ~ /\. { return 404; }
location ~ \.[^/]+$ { return 404; }
location / { try_files $uri /index.html; }
