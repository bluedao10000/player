location ~* ^/(workbench|editor-api|editor-preview|admin|v1(?:/|$)) { return 404; }
location ~ ^/(api/auth/callback/(wechat|github)|billing/alipay-return)$ {
    if ($request_method != GET) { return 405; }
    add_header Cache-Control no-store always;
    add_header Referrer-Policy no-referrer always;
    return 302 https://${ACCOUNT_HOST}$request_uri;
}
location ^~ /guides/ { return 301 https://${ACCOUNT_HOST}$request_uri; }
location ^~ /api/wechat-mini/ {
    limit_req zone=login burst=30 nodelay;
    client_max_body_size 12m;
    proxy_ssl_server_name on;
    proxy_ssl_name ${ACCOUNT_HOST};
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
    proxy_pass https://${ACCOUNT_HOST};
}
location = /api/billing/alipay/notify {
    if ($request_method != POST) { return 405; }
    limit_req zone=payment burst=100 nodelay;
    proxy_pass http://billing_origin;
}
location ~ ^/(reader-auth|ios-account)/ {
    limit_req zone=login burst=30 nodelay;
    proxy_pass http://auth_origin;
}
location ~ ^/api/v1/knowledge/(discovery|worlds(/[a-z0-9-]+(/(characters|chapters|scenes)/[a-z0-9-]+)?)?)$ {
    limit_except GET { deny all; }
    limit_req zone=reads burst=100 nodelay;
    proxy_pass http://api_origin;
}
location ~* ^/api(?:/|$) { return 404; }
# Renderer expands the private gray manifest into literal, exact locations.
${GRAY_ROUTES}
location @origin_timeout { return 503; }
location @original { proxy_pass http://fallback_origin; }
location /image-preview/ {
    add_header Cache-Control "private, no-store" always;
    return 404;
}
location /i/ {
    limit_except GET { deny all; }
    proxy_pass http://image_origin;
}
location /assets/ { proxy_pass http://static_origin; }
location / { proxy_pass http://web_origin; }
