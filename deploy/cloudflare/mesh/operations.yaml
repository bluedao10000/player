# Add to compose.yaml with -f. These listeners exist only inside the Mesh namespace.
x-relay: &relay
  image: alpine/socat@sha256:71131702f671a88b3808a70b7330f9679cd9b9933adcafadc191508edfe55bba
  network_mode: service:mesh
  restart: unless-stopped
  read_only: true
  cap_drop: [ALL]
  security_opt: [no-new-privileges:true]
services:
  reader-ssh:
    <<: *relay
    profiles: [aliyun]
    user: "1000"
    command:
    - TCP4-LISTEN:2222,bind=${ALI_MESH_IP:-127.0.0.1},range=${SV_MESH_IP:-127.0.0.1}/32,reuseaddr,fork
    - TCP4:${ALI_DOCKER_GATEWAY:-127.0.0.1}:22
  release-socket:
    <<: *relay
    profiles: [silicon-valley]
    user: "1000"
    volumes: [/srv/folio-data/release-socket:/socket]
    command:
    - UNIX-LISTEN:/socket/reader.sock,mode=0600,unlink-early,fork
    - TCP4:${ALI_MESH_IP:-127.0.0.1}:2222
  backup-listener:
    <<: *relay
    profiles: [guangzhou]
    user: "1000"
    volumes: [./postgres-resolv.conf:/etc/resolv.conf:ro]
    command:
    - TCP4-LISTEN:5433,bind=${GZ_MESH_IP:-127.0.0.1},range=${BACKUP_MESH_IP:-127.0.0.1}/32,reuseaddr,fork
    - TCP4:folio-db:5432
  backup-socket:
    <<: *relay
    profiles: [backup]
    user: "70"
    volumes: [/var/lib/folio-mesh/backup-socket:/socket]
    command:
    - UNIX-LISTEN:/socket/.s.PGSQL.5432,mode=0600,unlink-early,fork
    - TCP4:${GZ_MESH_IP:-127.0.0.1}:5433
