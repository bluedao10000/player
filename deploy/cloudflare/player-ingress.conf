events {}
http {
    access_log off;
    server_tokens off;

    map $cookie_folio_reader $identity_cookie {
        default "";
        "~^[a-f0-9]{64}$" "folio_reader=$cookie_folio_reader";
    }
    map $cookie_folio_flow $flow_cookie {
        default "";
        "~^[a-f0-9]{64}$" "folio_flow=$cookie_folio_flow";
    }
    map $uri $app_cookie {
        /reader-auth/callback/wechat "$identity_cookie; $flow_cookie";
        default "";
        ~^/reader-auth/ $identity_cookie;
    }

    map $host $index_policy {
        default "";
        origin.example.org "noindex, nofollow";
    }

    server {
        listen 127.0.0.1:14380;
        server_name reader.example.org origin.example.org;
        add_header X-Robots-Tag $index_policy always;
        location ~* ^/(workbench|editor-api|editor-preview) { return 404; }
        location ~ ^/(api/auth/callback/(wechat|github)|billing/alipay-return)$ {
            if ($request_method != GET) { return 405; }
            add_header Cache-Control no-store always;
            add_header Referrer-Policy no-referrer always;
            return 302 https://account.example.org$request_uri;
        }
        location = /folio-move { rewrite ^ /folio-move.html last; }
        # Previously distributed Folio mini-programs still use the www API base.
        location ^~ /api/wechat-mini/ {
            client_max_body_size 12m;
            proxy_ssl_server_name on;
            proxy_ssl_verify on;
            proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
            proxy_set_header Host account.example.org;
            proxy_set_header Cookie "";
            proxy_pass https://account.example.org;
        }
        location ^~ /guides/ {
            return 301 https://account.example.org$request_uri;
        }
        # Exact asset paths from the verified private manifest.
        location ~ ^/__PUBLIC_ASSET_PATHS__$ {
            limit_except GET { deny all; }
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_connect_timeout 3s;
            proxy_read_timeout 25s;
            proxy_force_ranges on;
            proxy_intercept_errors on;
            error_page 502 503 504 = @naruto_original;
            proxy_pass http://127.0.0.1:14581;
        }
        location @naruto_original {
            proxy_set_header Host reader.example.org;
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_pass http://127.0.0.1:14310;
        }
        location ~ ^/image-preview/__PUBLIC_ASSET_PATHS__$ {
            limit_except GET { deny all; }
            proxy_set_header Cookie "";
            proxy_set_header Authorization "";
            proxy_hide_header Cache-Control;
            add_header Cache-Control "private, no-store" always;
            add_header Referrer-Policy no-referrer always;
            proxy_pass http://127.0.0.1:14581;
        }
        location / {
            proxy_set_header Host reader.example.org;
            proxy_set_header X-Forwarded-Host reader.example.org;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header Forwarded "";
            proxy_set_header Cookie $app_cookie;
            proxy_buffering off;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_pass http://127.0.0.1:14310;
        }
    }
}
