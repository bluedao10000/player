apiVersion: v1
kind: ServiceAccount
metadata: {name: backup-report}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: backup-report}
rules:
- {apiGroups: [batch], resources: [jobs], verbs: [list]}
- {apiGroups: [''], resources: [pods], verbs: [list]}
- {apiGroups: [''], resources: [pods/log], verbs: [get]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: backup-report}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: backup-report}
subjects: [{kind: ServiceAccount, name: backup-report}]
---
apiVersion: batch/v1
kind: CronJob
metadata: {name: backup-report}
spec:
  schedule: "*/3 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      activeDeadlineSeconds: 115
      backoffLimit: 1
      template:
        spec:
          serviceAccountName: backup-report
          restartPolicy: Never
          nodeSelector: {kubernetes.io/hostname: your-backup-node}
          securityContext: {runAsUser: 70, runAsGroup: 70, runAsNonRoot: true, seccompProfile: {type: RuntimeDefault}}
          containers:
          - name: reporter
            image: localhost/folio/backup-report:v1.3
            imagePullPolicy: Never
            securityContext: {readOnlyRootFilesystem: true, allowPrivilegeEscalation: false, capabilities: {drop: [ALL]}}
            resources: {requests: {cpu: 10m, memory: 16Mi}, limits: {memory: 64Mi}}
            env:
            - name: PGPASSWORD
              valueFrom: {secretKeyRef: {name: backup-report-login, key: password}}
            volumeMounts: [{name: source, mountPath: /source, readOnly: true}]
          volumes:
          - name: source
            hostPath: {path: /var/lib/folio-mesh/backup-socket, type: Directory}
