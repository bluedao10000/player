ht="650" text-anchor="start">阅读公开故事</text><text x="472" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">从指定一幕进入互动</text></g><g class="node" data-node="choice" tabindex="0" role="button" aria-label="已实现，选择预设行动"><title>试玩提供两种行动，回应来自故事目录，在客户端完成。</title><rect x="722" y="147" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="736" y="167" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="736" y="192" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">选择预设行动</text><text x="736" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">显示该选项的固定回应</text></g><g class="node" data-node="local" tabindex="0" role="button" aria-label="已实现，保存或重选"><title>当前选择按故事 slug 写入 localStorage。读者可尝试另一种选择或返回故事。</title><rect x="986" y="147" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="1000" y="167" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="1000" y="192" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">保存或重选</text><text x="1000" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">同一浏览器可恢复选择</text></g><g class="node" data-node="session" tabindex="0" role="button" aria-label="待开发，创建私人会话"><title>目标从公开故事进入，签发游客身份，冻结会话起点和角色卡版本。</title><rect x="194" y="281" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="208" y="301" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="208" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">创建私人会话</text><text x="208" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">绑定角色卡与开场场景</text></g><g class="node" data-node="action" tabindex="0" role="button" aria-label="待开发，提交行动"><title>行动带幂等键。Gin 投递任务，Agent 读取允许使用的资料，返回叙述、对白和状态补丁。</title><rect x="458" y="281" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="472" y="301" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="472" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">提交行动</text><text x="472" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">Agent 调用模型生成回合</text></g><g class="node" data-node="turn" tabindex="0" role="button" aria-label="待开发，写入剧情状态"><title>服务端确认该回合并更新私有时间线。后续行动复用已确认状态，SSE 通知客户端进度。</title><rect x="722" y="281" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="736" y="301" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="736" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">写入剧情状态</text><text x="736" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">确认本回合，可继续行动</text></g><g class="node" data-node="consent" tabindex="0" role="button" aria-label="待开发，选取并授权一幕"><title>只有读者主动选择并确认的摘编才进入编辑流程。其他回合留在私有会话。</title><rect x="986" y="281" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1000" y="301" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="1000" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">选取并授权一幕</text><text x="1000" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">读者预览并确认分享范围</text></g><g class="node" data-node="draft" tabindex="0" role="button" aria-label="待开发，形成候选草稿"><title>私聊摘编移除个人信息与私有设定。编辑也可直接创作，或委托 Agent 生成独立草稿。</title><rect x="986" y="415" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1000" y="435" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="1000" y="460" font-size="20" f tart">Go 同步 Worker</text><text x="359" y="236" font-size="14" fill="#475759" font-weight="400" text-anchor="start">版本探测 · 校验 · Normalize</text></g><g class="node" data-node="stagepg" tabindex="0" role="button" aria-label="已实现，PostgreSQL 来源层"><title>staging_source_records 隔离未验证批次。成功合并时持久化来源、版本和 raw/norm 记录，同时提交同步统计。</title><rect x="654" y="158" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="668" y="178" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="668" y="211" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">PostgreSQL 来源层</text><text x="668" y="236" font-size="14" fill="#475759" font-weight="400" text-anchor="start">批次暂存 · 源记录 · 版本审计</text></g><g class="node" data-node="works" tabindex="0" role="button" aria-label="已实现，PostgreSQL 作品层"><title>来源层和作品层共用 PostgreSQL 17。只在验证后提交事务。works UUID 供业务引用，标题、站点 ID、播出和关系可追溯。</title><rect x="963" y="158" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="977" y="178" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="977" y="211" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">PostgreSQL 作品层</text><text x="977" y="236" font-size="14" fill="#475759" font-weight="400" text-anchor="start">works · 关联数据 · 匹配候选</text></g><g class="node" data-node="web" tabindex="0" role="button" aria-label="已实现，TanStack Start"><title>公开故事从仓库目录渲染；知识库页面通过 server function 调用共享客户端。两类数据入口分开。</title><rect x="36" y="345" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="50" y="365" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="50" y="398" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">TanStack Start</text><text x="50" y="423" font-size="14" fill="#475759" font-weight="400" text-anchor="start">H5 / SSR · 知识检索 server fn</text></g><g class="node" data-node="cl const charts=JSON.parse(document.querySelector('#data').textContent);
const sheets=[...document.querySelectorAll('.sheet')], tabs=[...document.querySelectorAll('nav button')];
let ci=0, ni=0;
function selectNode(i,scroll=false){
  const c=charts[ci], n=c.nodes[i]; ni=i;
  const nodes=[...sheets[ci].querySelectorAll('.node')];
  nodes.forEach((el,j)=>el.setAttribute('aria-current',String(i===j)));
  if(scroll){const frame=sheets[ci].querySelector('.frame'), rect=nodes[i].getBoundingClientRect(), f=frame.getBoundingClientRect();
    if(rect.left<f.left||rect.right>f.right)frame.scrollLeft+=rect.left-f.left-30;}
  document.querySelector('#position').textContent=(i+1)+' / '+c.nodes.length+'　·　'+n.status;
  document.querySelector('#nodeTitle').textContent=n.title;
  document.querySelector('#detail').textContent=n.detail;
  const names=Object.fromEntries(c.nodes.map(n=>[n.id,n.title]));
  const inputs=c.edges.filter(e=>e.b===n.id).map(e=>names[e.a]), outputs=c.edges.filter(e=>e.a===n.id).map(e=>names[e.b]);
  document.querySelector('#related').textContent=[[ci===0?'所属':'来自',inputs],[ci===0?'包含':'通向',outputs]].filter(v=>v[1].length).map(v=>v[0]+'　'+v[1].join('、')).join('　 /　');
  const refs=document.querySelector('.sources');refs.replaceChildren(...n.refs.map(r=>{const a=document.createElement('a');a.href='../'+r;a.textContent=r;return a;}));
  document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===c.nodes.length-1;
}
function show(i){ci=i;sheets.forEach((s,j)=>s.hidden=i!==j);tabs.forEach((s,j)=>s.setAttribute('aria-pressed',String(i===j)));
  document.querySelector('#svgFile').href='diagrams/'+charts[i].key+'.svg';document.querySelector('#mmdFile').href=charts[i].mfile;selectNode(0,true);}
tabs.forEach((el,i)=>el.onclick=()=>show(i));
sheets.forEach(s=>s.querySelectorAll('.node').forEach((el,i)=>{el.onclick=()=>selectNode(i);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(i);}};}));
document.querySelector('#prev').onclick=()=>selectNode(ni-1,true);document.querySelector('#next').onclick=()=>selectNode(ni+1,true);show(0);
</script></html>
