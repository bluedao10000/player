  document.querySelector('#related').textContent=[[ci===0?'所属':'来自',inputs],[ci===0?'包含':'通向',outputs]].filter(v=>v[1].length).map(v=>v[0]+'　'+v[1].join('、')).join('　 /　');
  const refs=document.querySelector('.sources');refs.replaceChildren(...n.refs.map(r=>{const a=document.createElement('a');a.href='../'+r;a.textContent=r;return a;}));
  document.querySelector('#prev').disabled=i===0;document.querySelector('#next').disabled=i===c.nodes.length-1;
}
function show(i){ci=i;sheets.forEach((s,j)=>s.hidden=i!==j);tabs.forEach((s,j)=>s.setAttribute('aria-pressed',String(i===j)));
  document.querySelector('#svgFile').href='diagrams/'+charts[i].key+'.svg';document.querySelector('#mmdFile').href=charts[i].mfile;selectNode(0,true);}
tabs.forEach((el,i)=>el.onclick=()=>show(i));
sheets.forEach(s=>s.querySelectorAll('.node').forEach((el,i)=>{el.onclick=()=>selectNode(i);el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(i);}};}));
document.querySelector('#prev').onclick=()=>selectNode(ni-1,true);document.querySelector('#next').onclick=()=>selectNode(ni+1,true);show(0);
</script></html>
