<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-labelledby="title-business desc-business" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title-business">潮汐邮局 · 业务流程图</title><desc id="desc-business">公开阅读与预设试玩已经连通。私人回合、授权摘编和审核发布构成下一阶段的内容循环。 蓝绿色为当前路径，紫色虚线为待开发路径。同步任务独立运行；校验失败或合并回滚时继续提供上一成功版本。</desc><defs><marker id="business-live" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#47736e"/></marker><marker id="business-next" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#986987"/></marker></defs><rect width="1280" height="720" fill="#faf9f4"/><text x="36" y="34" font-size="14" fill="#386862" font-weight="700" text-anchor="start">潮 汐 邮 局   /   WORKFLOWS</text><text x="36" y="75" font-size="32" fill="#233c43" font-weight="700" text-anchor="start">业务流程图</text><text x="36" y="104" font-size="16" fill="#465a5e" font-weight="400" text-anchor="start">公开阅读与预设试玩已经连通。私人回合、授权摘编和审核发布构成下一阶段的内容循环。</text><line x1="1000" y1="65" x2="1030" y2="65" stroke="#317167" stroke-width="2"/><text x="1040" y="70" font-size="15" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><line x1="1120" y1="65" x2="1150" y2="65" stroke="#986987" stroke-width="2" stroke-dasharray="5 4"/><text x="1160" y="70" font-size="15" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><line x1="36" y1="126" x2="1244" y2="126" stroke="#c7c7bc"/><text x="40" y="169" font-size="19" fill="#293e46" font-weight="650" text-anchor="start">读者</text><text x="40" y="193" font-size="13" fill="#465a5e" font-weight="400" text-anchor="start">公开阅读与试玩</text><line x1="36" y1="260" x2="1244" y2="260" stroke="#c7c7bc"/><text x="40" y="303" font-size="19" fill="#293e46" font-weight="650" text-anchor="start">读者与角色</text><text x="40" y="327" font-size="13" fill="#465a5e" font-weight="400" text-anchor="start">私人时间线</text><line x1="36" y1="394" x2="1244" y2="394" stroke="#c7c7bc"/><text x="40" y="437" font-size="19" fill="#293e46" font-weight="650" text-anchor="start">编辑与读者</text><text x="40" y="461" font-size="13" fill="#465a5e" font-weight="400" text-anchor="start">从右向左阅读</text><line x1="36" y1="528" x2="1244" y2="528" stroke="#c7c7bc"/><text x="40" y="571" font-size="19" fill="#293e46" font-weight="650" text-anchor="start">同步任务</text><text x="40" y="595" font-size="13" fill="#465a5e" font-weight="400" text-anchor="start">独立定时运行</text><text x="960" y="513" font-size="12" fill="#795471" font-weight="500" text-anchor="middle">退回修改</text><polyline points="428,189 458,189" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>关联</title></polyline><polyline points="692,189 722,189" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>关联</title></polyline><polyline points="956,189 986,189" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>关联</title></polyline><polyline points="428,323 458,323" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="692,323 722,323" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="956,323 986,323" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>自愿分享</title></polyline><polyline points="986,457 956,457" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="722,457 692,457" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>通过</title></polyline><polyline points="458,457 428,457" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="428,591 458,591" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>发现新版本</title></polyline><polyline points="692,591 722,591" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>关联</title></polyline><polyline points="956,591 986,591" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>关联</title></polyline><polyline points="575,232 575,247 311,247 311,281" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>正式会话入口</title></polyline><polyline points="1103,366 1103,415" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="194,457 163,457 163,189 194,189" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>公开内容回流</title></polyline><polyline points="839,500 839,517 1103,517 1103,500" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>退回修改</title></polyline><g class="node" data-node="entry" role="group" aria-label="已实现，发现首页或角色"><title>读者可从首页或阿澪的公开角色页进入故事。站内可访问，实际搜索引擎收录情况需在线上核实。</title><rect x="194" y="147" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="208" y="167" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="208" y="192" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">发现首页或角色</text><text x="208" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">直接访问公开链接</text></g><g class="node" data-node="story" role="group" aria-label="已实现，阅读公开故事"><title>公开故事由静态目录驱动。读者可阅读、收藏，或由文内入口进入对应的试玩。</title><rect x="458" y="147" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="472" y="167" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="472" y="192" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">阅读公开故事</text><text x="472" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">从指定一幕进入互动</text></g><g class="node" data-node="choice" role="group" aria-label="已实现，选择预设行动"><title>试玩提供两种行动，回应来自故事目录，在客户端完成。</title><rect x="722" y="147" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="736" y="167" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="736" y="192" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">选择预设行动</text><text x="736" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">显示该选项的固定回应</text></g><g class="node" data-node="local" role="group" aria-label="已实现，保存或重选"><title>当前选择按故事 slug 写入 localStorage。读者可尝试另一种选择或返回故事。</title><rect x="986" y="147" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="1000" y="167" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="1000" y="192" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">保存或重选</text><text x="1000" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">同一浏览器可恢复选择</text></g><g class="node" data-node="session" role="group" aria-label="待开发，创建私人会话"><title>目标从公开故事进入，签发游客身份，冻结会话起点和角色卡版本。</title><rect x="194" y="281" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="208" y="301" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="208" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">创建私人会话</text><text x="208" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">绑定角色卡与开场场景</text></g><g class="node" data-node="action" role="group" aria-label="待开发，提交行动"><title>行动带幂等键。Gin 投递任务，Agent 读取允许使用的资料，返回叙述、对白和状态补丁。</title><rect x="458" y="281" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="472" y="301" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="472" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">提交行动</text><text x="472" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">Agent 调用模型生成回合</text></g><g class="node" data-node="turn" role="group" aria-label="待开发，写入剧情状态"><title>服务端确认该回合并更新私有时间线。后续行动复用已确认状态，SSE 通知客户端进度。</title><rect x="722" y="281" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="736" y="301" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="736" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">写入剧情状态</text><text x="736" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">确认本回合，可继续行动</text></g><g class="node" data-node="consent" role="group" aria-label="待开发，选取并授权一幕"><title>只有读者主动选择并确认的摘编才进入编辑流程。其他回合留在私有会话。</title><rect x="986" y="281" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1000" y="301" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="1000" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">选取并授权一幕</text><text x="1000" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">读者预览并确认分享范围</text></g><g class="node" data-node="draft" role="group" aria-label="待开发，形成候选草稿"><title>私聊摘编移除个人信息与私有设定。编辑也可直接创作，或委托 Agent 生成独立草稿。</title><rect x="986" y="415" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1000" y="435" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="1000" y="460" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">形成候选草稿</text><text x="1000" y="481" font-size="14" fill="#475759" font-weight="400" text-anchor="start">摘编脱敏或编辑委托生成</text></g><g class="node" data-node="review" role="group" aria-label="待开发，编辑审核"><title>编辑预览修订并核对来源。审核未通过可退回草稿修改，已发布版本继续可读。</title><rect x="722" y="415" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="736" y="435" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="736" y="460" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">编辑审核</text><text x="736" y="481" font-size="14" fill="#475759" font-weight="400" text-anchor="start">核查来源与公开范围</text></g><g class="node" data-node="publish" role="group" aria-label="待开发，发布内容版本"><title>事务切换发布版本，公开索引和 sitemap 随之更新。</title><rect x="458" y="415" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="472" y="435" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="472" y="460" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">发布内容版本</text><text x="472" y="481" font-size="14" fill="#475759" font-weight="400" text-anchor="start">切换公开快照与索引</text></g><g class="node" data-node="rediscover" role="group" aria-label="待开发，新内容进入发现页"><title>已审核的公开版本成为新访问入口，形成从参与、编辑到再次阅读的循环。</title><rect x="194" y="415" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="208" y="435" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="208" y="460" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">新内容进入发现页</text><text x="208" y="481" font-size="14" fill="#475759" font-weight="400" text-anchor="start">沿公开链接回到阅读入口</text></g><g class="node" data-node="probe" role="group" aria-label="已实现，定时探测版本"><title>独立 worker 按源检查到期时间并加锁。版本未变只记录成功跳过。</title><rect x="194" y="549" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="208" y="569" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="208" y="594" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">定时探测版本</text><text x="208" y="615" font-size="14" fill="#475759" font-weight="400" text-anchor="start">未变化就记账并结束</text></g><g class="node" data-node="stage" role="group" aria-label="已实现，下载与构建暂存批次"><title>发现新版本后下载到临时文件，验证后解析。按批 COPY 到 staging，重复键或无效条目使该次同步失败。</title><rect x="458" y="549" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="472" y="569" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="472" y="594" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">下载与构建暂存批次</text><text x="472" y="615" font-size="14" fill="#475759" font-weight="400" text-anchor="start">验摘要、解析、归一化</text></g><g class="node" data-node="merge" role="group" aria-label="已实现，匹配与事务合并"><title>先验证完整批次。可靠的跨源 ID 自动匹配，冲突与弱信号进入候选表。事务失败保留上一版作品。</title><rect x="722" y="549" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="736" y="569" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="736" y="594" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">匹配与事务合并</text><text x="736" y="615" font-size="14" fill="#475759" font-weight="400" text-anchor="start">稳定来源 ID 匹配或留候选</text></g><g class="node" data-node="available" role="group" aria-label="已实现，资料可查询"><title>提交后，H5 和 Pi 查询工具读取同一 canonical UUID；发布作品资料与发布原创故事是两套不同业务。</title><rect x="986" y="549" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="1000" y="569" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="1000" y="594" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">资料可查询</text><text x="1000" y="615" font-size="14" fill="#475759" font-weight="400" text-anchor="start">Gin 提供作品与来源版本</text></g><line x1="36" y1="677" x2="1244" y2="677" stroke="#c7c7bc"/><text x="36" y="702" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">蓝绿色为当前路径，紫色虚线为待开发路径。同步任务独立运行；校验失败或合并回滚时继续提供上一成功版本。</text><text x="1244" y="702" font-size="13" fill="#546665" font-weight="500" text-anchor="end">2026.11.18</text></svg>
