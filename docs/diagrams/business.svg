92,591 722,591" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="956,591 986,591" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="1103,634 1103,683" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>通过</title></polyline><polyline points="1020,634 1020,656 839,656 839,683" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>存疑</title></polyline><polyline points="956,725 986,725" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>通过</title></polyline><polyline points="722,725 692,725" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>需要返工</title></polyline><polyline points="980,634 980,647 575,647 575,683" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>规则失败</title></polyline><polyline points="458,725 428,725" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>超限</title></polyline><polyline points="575,768 575,784 967,784 967,613 956,613" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>下一轮</title></polyline><polyline points="311,232 311,281" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>版本未变</title></polyline><polyline points="575,232 575,281" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>校验失败</title></polyline><polyline points="813,232 813,248 642,248 642,281" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>合并失败</title></polyline><polyline points="1103,232 1103,250 880,250 880,281" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>已提交</title></polyline><polyline points="956,323 986,323" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>返回作品资料</title></polyline><g class="node" data-node="trigger" role="group" aria-label="已实现，定时检查双源版本"><title>常驻 Worker 每轮检查到期来源。已归档且版本未变时跳过导入；显式刷新或补归档可重新处理。</title><rect x="194" y="147" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="208" y="167" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="208" y="192" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">定时检查双源版本</text><text x="208" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">AOD 和 Bangumi 到期探测</text></g><g class="node" data-node="stage" role="group" aria-label="已实现，下载、校验与清洗"><title>校验下载摘要，使用来源解析器生成 raw 与 norm 并按批写入 staging。解析失败不会提交作品。</title><rect x="458" y="147" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="472" y="167" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="472" y="192" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">下载、校验与清洗</text><text x="472" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">按来源解析并归一化暂存</text></g><g class="node" data-node="publish" role="group" aria-label="已实现，匹配与合并作品"><title>可靠的来源 ID 用于跨源归并；冲突和弱匹配留在候选表。发布事务失败时现有作品可继续读取。</title><rect x="722" y="147" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="736" y="167" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="736" y="192" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">匹配与合并作品</text><text x="736" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">稳定 ID 对齐 · 冲突留候选</text></g><g class="node" data-node="reader" role="group" aria-label="已实现，生成或更新知识库"><title>同一事务写入来源记录、作品及关联投影、同步统计和当前来源版本。首次成功后可按 canonical UUID 查询；后续快照更新已有作品。</title><rect x="986" y="147" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="1000" y="167" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="1000" y="192" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">生成或更新知识库</text><text x="1000" y="213" font-size="14" fill="#475759" font-weight="400" text-anchor="start">事务提交 PostgreSQL 作品库</text></g><g class="node" data-node="clock" role="group" aria-label="已实现，质检任务到期"><title>数据服务按时调度。</title><rect x="194" y="415" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="208" y="435" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="208" y="460" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">质检任务到期</text><text x="208" y="481" font-size="14" fill="#475759" font-weight="400" text-anchor="start">数据服务按时调度</text></g><g class="node" data-node="rules" role="group" aria-label="已实现，扫描已提交作品"><title>质检有独立的到期条件。扫描当前活动作品，将问题和评分写入治理表。</title><rect x="458" y="415" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="472" y="435" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="472" y="460" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">扫描已提交作品</text><text x="472" y="481" font-size="14" fill="#475759" font-weight="400" text-anchor="start">13 项质量规则 · 可解释评分</text></g><g class="node" data-node="audit" role="group" aria-label="已实现，写入运行记录"><title>状态、时间、命中和结果。</title><rect x="722" y="415" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="736" y="435" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="736" y="460" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">写入运行记录</text><text x="736" y="481" font-size="14" fill="#475759" font-weight="400" text-anchor="start">状态、时间、命中和结果</text></g><g class="node" data-node="observe" role="group" aria-label="已实现，数据工作台"><title>展示拓扑和批次日志。</title><rect x="986" y="415" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="1000" y="435" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="1000" y="460" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">数据工作台</text><text x="1000" y="481" font-size="14" fill="#475759" font-weight="400" text-anchor="start">展示拓扑和批次日志</text></g><g class="node" data-node="gap" role="group" aria-label="待开发，发现图片缺口"><title>缺图、版本变化或到期。</title><rect x="194" y="549" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="208" y="569" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="208" y="594" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">发现图片缺口</text><text x="208" y="615" font-size="14" fill="#475759" font-weight="400" text-anchor="start">缺图、版本变化或到期</text></g><g class="node" data-node="job" role="group" aria-label="待开发，创建图片优化任务"><title>数据服务锁定预算与设定。</title><rect x="458" y="549" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="472" y="569" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="472" y="594" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">创建图片优化任务</text><text x="472" y="615" font-size="14" fill="#475759" font-weight="400" text-anchor="start">数据服务锁定预算与设定</text></g><g class="node" data-node="agent" role="group" aria-label="待开发，Pi 执行候选生成"><title>Harness 恢复与工具调用。</title><rect x="722" y="549" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="736" y="569" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="736" y="594" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">Pi 执行候选生成</text><text x="736" y="615" font-size="14" fill="#475759" font-weight="400" text-anchor="start">Harness 恢复与工具调用</text></g><g class="node" data-node="check" role="group" aria-label="待开发，验证候选与裁切"><title>数据服务执行规则。</title><rect x="986" y="549" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1000" y="569" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="1000" y="594" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">验证候选与裁切</text><text x="1000" y="615" font-size="14" fill="#475759" font-weight="400" text-anchor="start">数据服务执行规则</text></g><g class="node" data-node="fallback" role="group" aria-label="待开发，保留可用版本"><title>预算耗尽或无法确认。</title><rect x="194" y="683" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="208" y="703" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="208" y="728" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">保留可用版本</text><text x="208" y="749" font-size="14" fill="#475759" font-weight="400" text-anchor="start">预算耗尽或无法确认</text></g><g class="node" data-node="redo" role="group" aria-label="待开发，重裁或重新生成"><title>有预算时记录新轮次。</title><rect x="458" y="683" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="472" y="703" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="472" y="728" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">重裁或重新生成</text><text x="472" y="749" font-size="14" fill="#475759" font-weight="400" text-anchor="start">有预算时记录新轮次</text></g><g class="node" data-node="judge" role="group" aria-label="待开发，仅对疑点调用 Jev"><title>分项判断回传数据服务。</title><rect x="722" y="683" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="736" y="703" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="736" y="728" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">仅对疑点调用 Jev</text><text x="736" y="749" font-size="14" fill="#475759" font-weight="400" text-anchor="start">分项判断回传数据服务</text></g><g class="node" data-node="live" role="group" aria-label="待开发，自动发布合格版本"><title>按用途切换资产指针。</title><rect x="986" y="683" width="234" height="85" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1000" y="703" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="1000" y="728" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">自动发布合格版本</text><text x="1000" y="749" font-size="14" fill="#475759" font-weight="400" text-anchor="start">按用途切换资产指针</text></g><g class="node" data-node="skip" role="group" aria-label="已实现，跳过本轮导入"><title>已归档版本未变化时跳过下载与导入。首次补归档或显式刷新可重新处理同版本。</title><rect x="194" y="281" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="208" y="301" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="208" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">跳过本轮导入</text><text x="208" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">版本未变 · 记录成功跳过</text></g><g class="node" data-node="failed" role="group" aria-label="已实现，失败保留上一版"><title>下载、校验或合并失败时不提交新版本，记录失败并清理当前暂存。</title><rect x="458" y="281" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="472" y="301" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="472" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">失败保留上一版</text><text x="472" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">记录失败 · 清理本批暂存</text></g><g class="node" data-node="readapi" role="group" aria-label="已实现，Gin 查询作品库"><title>API 从同一 canonical 数据库查询作品、关联和来源。</title><rect x="722" y="281" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="736" y="301" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="736" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">Gin 查询作品库</text><text x="736" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">按作品 UUID / 标题读取</text></g><g class="node" data-node="use" role="group" aria-label="已实现，H5 与 Pi 使用知识"><title>Web 服务端和 Pi 知识工具使用共享 Gin 客户端。</title><rect x="986" y="281" width="234" height="85" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="1000" y="301" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="1000" y="326" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">H5 与 Pi 使用知识</text><text x="1000" y="347" font-size="14" fill="#475759" font-weight="400" text-anchor="start">展示作品或调用只读工具</text></g><line x1="36" y1="811" x2="1244" y2="811" stroke="#c7c7bc"/><text x="36" y="836" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">定时质检读取已提交作品，产出问题与评分。同步失败不切换知识库版本，访问方仍可查询最近一次成功结果。</text><text x="1244" y="836" font-size="13" fill="#546665" font-weight="500" text-anchor="end">2026.11.18</text></svg>
