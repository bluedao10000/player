<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-labelledby="title-business desc-business" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title-business">潮汐邮局 · 知识库构建整体流程</title><desc id="desc-business">通用资料清洗已运行；运营选定范围后，才启动拟建的 AI 深编与图片工作流。 绿色为已运行的清洗和样板路径。紫色为选题后的目标流程。失败重试、待补证和公开版本分别记录。</desc><defs><marker id="business-live" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#47736e"/></marker><marker id="business-next" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#986987"/></marker></defs><rect width="1280" height="720" fill="#faf9f4"/><text x="36" y="34" font-size="14" fill="#386862" font-weight="700" text-anchor="start">潮 汐 邮 局   /   KNOWLEDGE</text><text x="36" y="75" font-size="32" fill="#233c43" font-weight="700" text-anchor="start">知识库构建整体流程</text><text x="36" y="104" font-size="16" fill="#465a5e" font-weight="400" text-anchor="start">通用资料清洗已运行；运营选定范围后，才启动拟建的 AI 深编与图片工作流。</text><line x1="1000" y1="65" x2="1030" y2="65" stroke="#317167" stroke-width="2"/><text x="1040" y="70" font-size="15" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><line x1="1120" y1="65" x2="1150" y2="65" stroke="#986987" stroke-width="2" stroke-dasharray="5 4"/><text x="1160" y="70" font-size="15" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><polyline points="300,182 346,182" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>关联</title></polyline><polyline points="614,182 660,182" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>关联</title></polyline><polyline points="928,182 974,182" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>关联</title></polyline><polyline points="166,226 166,270" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#business-live)"><title>关联</title></polyline><polyline points="480,226 480,270" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>选中</title></polyline><polyline points="614,314 660,314" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="928,314 974,314" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="480,358 480,402" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="614,446 660,446" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="928,446 974,446" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="1108,358 1108,402" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>关联</title></polyline><polyline points="1144,490 1144,534" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>通过</title></polyline><polyline points="1004,490 1004,512 794,512 794,534" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>待补证或返工</title></polyline><polyline points="928,580 943,580 943,470 974,470" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#business-next)"><title>复验</title></polyline><g class="node" data-node="sync" role="group" aria-label="已实现，同步与清洗"><title>定时读取 AOD 与 bangumi-data，检查版本和完整性。异常保留上次成功结果。</title><rect x="32" y="138" width="268" height="88" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="46" y="158" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="46" y="183" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">同步与清洗</text><text x="46" y="204" font-size="14" fill="#475759" font-weight="400" text-anchor="start">按源探测 · 解析 · 归一化暂存</text></g><g class="node" data-node="clean" role="group" aria-label="已实现，基础档案"><title>按外站 ID 和版本归并到 PostgreSQL。普通作品到此可检索。基础档案保留来源与版本。</title><rect x="346" y="138" width="268" height="88" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="360" y="158" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="360" y="183" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">基础档案</text><text x="360" y="204" font-size="14" fill="#475759" font-weight="400" text-anchor="start">作品 UUID · 别名 · 来源版本</text></g><g class="node" data-node="sample" role="group" aria-label="已实现，已有关联知识"><title>潮汐邮局按自有键建档。《星际牛仔》锁定 1998 TV 版，以现成中文稿和外部规则核对前两集人物和场景。</title><rect x="660" y="138" width="268" height="88" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="674" y="158" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="674" y="183" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">已有关联知识</text><text x="674" y="204" font-size="14" fill="#475759" font-weight="400" text-anchor="start">原创清单 / 站内清单与外部证据</text></g><g class="node" data-node="reader" role="group" aria-label="已实现，已发布样板可读"><title>数据库事务切换完整发布版本。现有“可访问”是样板事实，五维正式验收待接入。</title><rect x="974" y="138" width="268" height="88" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="988" y="158" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="988" y="183" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">已发布样板可读</text><text x="988" y="204" font-size="14" fill="#475759" font-weight="400" text-anchor="start">Gin → H5 · 章节与场景互链</text></g><g class="node" data-node="observe" role="group" aria-label="已实现，定时质检与运行观测"><title>数据服务定时运行规则。工作台展示批次、跳过和失败；作业错误可重试。</title><rect x="32" y="270" width="268" height="88" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="46" y="290" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="46" y="315" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">定时质检与运行观测</text><text x="46" y="336" font-size="14" fill="#475759" font-weight="400" text-anchor="start">检查入库质量 · 查看同步结果</text></g><g class="node" data-node="select" role="group" aria-label="待开发，运营选定构建范围"><title>默认只同步资料。运营选题是资源分配；后面的执行、审核与发布自动完成。</title><rect x="346" y="270" width="268" height="88" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="360" y="290" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="360" y="315" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">运营选定构建范围</text><text x="360" y="336" font-size="14" fill="#475759" font-weight="400" text-anchor="start">指定版本、集章范围、必需图位</text></g><g class="node" data-node="research" role="group" aria-label="待开发，AI 联网研究与取证"><title>数据服务调度，Pi Durable 搜索与比对来源，区分原作事实和站内解读。原创以自有原稿为首要依据。</title><rect x="660" y="270" width="268" height="88" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="674" y="290" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="674" y="315" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">AI 联网研究与取证</text><text x="674" y="336" font-size="14" fill="#475759" font-weight="400" text-anchor="start">Pi 查权威资料 · 对齐清洗事实</text></g><g class="node" data-node="draft" role="group" aria-label="待开发，编写四类候选内容"><title>解释人物动机、事件因果及设定影响；内部事件线区分回忆与集序。输出来源、章节锚点、范围和缺口。</title><rect x="974" y="270" width="268" height="88" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="988" y="290" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="988" y="315" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">编写四类候选内容</text><text x="988" y="336" font-size="14" fill="#475759" font-weight="400" text-anchor="start">人物 · 剧情 · 世界观 · 时间线</text></g><g class="node" data-node="pics" role="group" aria-label="待开发，创建图位任务"><title>每个图位继承作品版本、参考设定、用途和裁切目标。领取已有合规素材或经 Pi 生成候选。</title><rect x="346" y="402" width="268" height="88" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="360" y="422" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="360" y="447" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">创建图位任务</text><text x="360" y="468" font-size="14" fill="#475759" font-weight="400" text-anchor="start">主视觉 · 角色立绘 · 场景图</text></g><g class="node" data-node="checkpic" role="group" aria-label="待开发，自动验图与优化"><title>视觉疑点委派 Jev 或其他具备视觉能力的模型。未过质量项重裁或重生成；使用依据缺失进入待补证。</title><rect x="660" y="402" width="268" height="88" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="674" y="422" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="674" y="447" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">自动验图与优化</text><text x="674" y="468" font-size="14" fill="#475759" font-weight="400" text-anchor="start">来源 · 一致性 · 剧情 · 手机裁切</text></g><g class="node" data-node="gate" role="group" aria-label="待开发，五维通过 → 知识已验收"><title>校验人物、剧情、世界观、时间线及必需图位，列出阻塞项。集数覆盖不能替代叙事完整度。</title><rect x="974" y="402" width="268" height="88" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="988" y="422" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="988" y="447" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">五维通过 → 知识已验收</text><text x="988" y="468" font-size="14" fill="#475759" font-weight="400" text-anchor="start">覆盖范围 · 叙事质量 · 图位通过数</text></g><g class="node" data-node="fix" role="group" aria-label="待开发，待补证或返工"><title>证据冲突或缺失进待补证；质量返工重做相关项；网络超时只更新任务状态。保留已公开版本。</title><rect x="660" y="534" width="268" height="88" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="674" y="554" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="674" y="579" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">待补证或返工</text><text x="674" y="600" font-size="14" fill="#475759" font-weight="400" text-anchor="start">补材料／重编／重裁后复验</text></g><g class="node" data-node="publish" role="group" aria-label="待开发，正式发布指定范围"><title>验收结论绑定范围与版本，数据服务事务切换正式版，Gin 提供读取。新一集产生增量草稿；旧公开版持续可读。</title><rect x="974" y="534" width="268" height="88" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="988" y="554" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="988" y="579" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">正式发布指定范围</text><text x="988" y="600" font-size="14" fill="#475759" font-weight="400" text-anchor="start">按范围切换版本 · 新集增量重验</text></g><line x1="36" y1="677" x2="1244" y2="677" stroke="#c7c7bc"/><text x="36" y="702" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">绿色为已运行的清洗和样板路径。紫色为选题后的目标流程。失败重试、待补证和公开版本分别记录。</text><text x="1244" y="702" font-size="13" fill="#546665" font-weight="500" text-anchor="end">2026.11.18</text></svg>
