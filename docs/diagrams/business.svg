<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 854" aria-labelledby="title-business desc-business" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title-business">潮汐邮局 · 业务流程图</title><desc id="desc-business">数据服务定时探测上游、清洗记录、匹配作品，首次生成知识库，此后持续更新。质检和图片优化分别调度。 定时质检读取已提交作品，产出问题与评分。同步失败不切换知识库版本，访问方仍可查询最近一次成功结果。</desc><defs><marker id="business-live" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#47736e"/></marker><marker id="business-next" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#986987"/></marker></defs><rect width="1280" height="854" fill="#faf9f4"/><text x="36" y="34" font-size="14" fill="#386862" font-weight="700" text-anchor="start">潮 汐 邮 局   /   WORKFLOWS</text><text x="36" y="75" font-size="32" fill="#233c43" font-weight="700" text-anchor="start">业务流程图</text><text x="36" y="104" font-size="16" fill="#465a5e" font-weight="400" text-anchor="start">数据服务定时探测上游、清洗记录、匹配作品，首次生成知识库，此后持续更新。质检和图片优化分别调度。</text><line x1="1000" y1="65" x2="1030" y2="65" stroke="#317167" stroke-width="2"/><text x="1040" y="70" font-size="15" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><line x1="1120" y1="65" x2="1150" y2="65" stroke="#986987" stroke-width="2" stroke-dasharray="5 4"/><text x="1160" y="70" font-size="15" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><line x1="36" y1="126" x2="1244" y2="126" stroke="#c7c7bc"/><text x="40" y="169" font-size="19" fill="#293e46" font-weight="650" text-anchor="start">知识库生成</text><text x="40" y="193" font-size="13" fill="#465a5e" font-weight="400" text-anchor="start">定时执行</text><line x1="36" y1="260" x2="1244" y2="260" stroke="#c7c7bc"/><text x="40" y="303" font-size="19" fill="#293e46" font-weight="650" text-anchor="start">同步结果</text><text x="40" y="327" font-size="13" fill="#465a5e" font-weight="400" text-anchor="start">按运行结果分支</text><li