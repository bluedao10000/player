<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-labelledby="title-product desc-product" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title-product">潮汐邮局 · 产品架构图</title><desc id="desc-product">读者从公开内容认识角色，进入私人剧情。作品资料和编辑出版分别承担事实查询与故事生产。 绿色实线框表示已实现，紫色虚线框表示待开发。分支线表示能力归属。</desc><defs><marker id="product-live" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#47736e"/></marker><marker id="product-next" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#986987"/></marker></defs><rect width="1280" height="720" fill="#faf9f4"/><text x="36" y="34" font-size="14" fill="#386862" font-weight="700" text-anchor="start">潮 汐 邮 局   /   PRODUCT</text><text x="36" y="75" font-size="32" fill="#233c43" font-weight="700" text-anchor="start">产品架构图</text><text x="36" y="104" font-size="16" fill="#465a5e" font-weight="400" text-anchor="start">读者从公开内容认识角色，进入私人剧情。作品资料和编辑出版分别承担事实查询与故事生产。</text><line x1="1000" y1="65" x2="1030" y2="65" stroke="#317167" stroke-width="2"/><text x="1040" y="70" font-size="15" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><line x1="1120" y1="65" x2="1150" y2="65" stroke="#986987" stroke-width="2" stroke-dasharray="5 4"/><text x="1160" y="70" font-size="15" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><polyline points="640,205 640,231 179,231 179,259" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round"><title>关联</title></polyline><polyline points="46,342 46,443 56,443" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round"><title>关联</title></polyline><polyline points="46,443 46,588 56,588" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4"><title>关联</title></polyline><polyline points="640,205 640,231 485,231 485,259" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round"><title>关联</title></polyline><polyline points="352,342 352,443 362,443" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round"><title>关联</title></polyline><polyline points="352,443 352,588 362,588" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4"><title>关联</title></polyline><polyline points="640,205 640,231 791,231 791,259" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round"><title>关联</title></polyline><polyline points="658,342 658,443 668,443" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round"><title>关联</title></polyline><polyline points="658,443 658,588 668,588" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4"><title>关联</title></polyline><polyline points="640,205 640,231 1097,231 1097,259" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round"><title>关联</title></polyline><polyline points="964,342 964,443 974,443" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round"><title>关联</title></polyline><polyline points="964,443 964,588 974,588" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4"><title>关联</title></polyline><g class="node" data-node="site" role="group" aria-label="产品，潮汐邮局"><title>首页以白帆港原创角色和故事为入口。作品知识库提供可追溯的资料，个人剧情和编辑出版各有独立边界。</title><rect x="458" y="128" width="364" height="77" rx="8" fill="#27454c" stroke="#27454c" stroke-width="1.4"/><text x="472" y="148" font-size="13" fill="#ffffff" font-weight="650" text-anchor="start">产品</text><text x="472" y="173" font-size="20" fill="#fff" font-weight="650" text-anchor="start">潮汐邮局</text><text x="472" y="194" font-size="14" fill="#e1eeeb" font-weight="400" text-anchor="start">面向二次元读者的角色故事 H5</text></g><g class="node" data-node="read" role="group" aria-label="能力领域，阅读与发现"><title>让读者找到并读完一个故事。</title><rect x="36" y="259" width="286" height="83" rx="8" fill="#e5e9e6" stroke="#7a8b89" stroke-width="1.4"/><text x="50" y="279" font-size="13" fill="#425557" font-weight="650" text-anchor="start">能力领域</text><text x="50" y="304" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">阅读与发现</text><text x="50" y="325" font-size="14" fill="#475759" font-weight="400" text-anchor="start">让读者找到并读完一个故事</text></g><g class="node" data-node="read1" role="group" aria-label="已实现，公开阅读 H5"><title>现有公开页使用 TanStack Start SSR 和本地原创目录。角色和故事可直接打开，故事有标题、描述和可读正文。</title><rect x="56" y="395" width="266" height="96" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="70" y="415" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="70" y="448" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">公开阅读 H5</text><text x="70" y="473" font-size="14" fill="#475759" font-weight="400" text-anchor="start">首页 · 阿澪角色页 · 故事阅读</text></g><g class="node" data-node="read2" role="group" aria-label="待开发，内容入口与分发"><title>场景、世界、百科的独立内容页，以及 canonical、结构化数据、自动 sitemap、iOS 壳与 Universal Links 属于规划。</title><rect x="56" y="540" width="266" height="96" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="70" y="560" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="70" y="593" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">内容入口与分发</text><text x="70" y="618" font-size="14" fill="#475759" font-weight="400" text-anchor="start">独立场景与百科 · SEO/GEO · iOS</text></g><g class="node" data-node="play" role="group" aria-label="能力领域，私人剧情"><title>从某一幕进入角色互动。</title><rect x="342" y="259" width="286" height="83" rx="8" fill="#e5e9e6" stroke="#7a8b89" stroke-width="1.4"/><text x="356" y="279" font-size="13" fill="#425557" font-weight="650" text-anchor="start">能力领域</text><text x="356" y="304" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">私人剧情</text><text x="356" y="325" font-size="14" fill="#475759" font-weight="400" text-anchor="start">从某一幕进入角色互动</text></g><g class="node" data-node="play1" role="group" aria-label="已实现，预设分支与本机进度"><title>进入 /play/{slug} 后从两种预设行动中选择，显示固定回应。选择和书架保存在同一浏览器。互动路由设置 noindex。</title><rect x="362" y="395" width="266" height="96" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="376" y="415" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="376" y="448" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">预设分支与本机进度</text><text x="376" y="473" font-size="14" fill="#475759" font-weight="400" text-anchor="start">两种行动 · 本机选择与收藏</text></g><g class="node" data-node="play2" role="group" aria-label="待开发，持续角色扮演"><title>目标是按用户隔离的服务端会话，结合角色卡、模型和剧情状态处理行动，重连后续玩。</title><rect x="362" y="540" width="266" height="96" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="376" y="560" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="376" y="593" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">持续角色扮演</text><text x="376" y="618" font-size="14" fill="#475759" font-weight="400" text-anchor="start">游客身份 · 自由行动 · 多轮续玩</text></g><g class="node" data-node="know" role="group" aria-label="能力领域，作品知识库"><title>为读者和 Agent 提供来源。</title><rect x="648" y="259" width="286" height="83" rx="8" fill="#e5e9e6" stroke="#7a8b89" stroke-width="1.4"/><text x="662" y="279" font-size="13" fill="#425557" font-weight="650" text-anchor="start">能力领域</text><text x="662" y="304" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">作品知识库</text><text x="662" y="325" font-size="14" fill="#475759" font-weight="400" text-anchor="start">为读者和 Agent 提供来源</text></g><g class="node" data-node="know1" role="group" aria-label="已实现，作品检索与溯源"><title>双源定时同步至 PostgreSQL。H5 支持搜索和详情，Pi 已注册两个经 Gin 查询的只读工具。资料查询页使用 noindex。</title><rect x="668" y="395" width="266" height="96" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="682" y="415" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="682" y="448" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">作品检索与溯源</text><text x="682" y="473" font-size="14" fill="#475759" font-weight="400" text-anchor="start">作品 UUID · 别名 · 播出与来源</text></g><g class="node" data-node="know2" role="group" aria-label="待开发，匹配审核与语义检索"><title>目前冲突和弱匹配可列入候选并查询。人工确认或拒绝的写入流程、世界线过滤与向量检索仍待接入。</title><rect x="668" y="540" width="266" height="96" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="682" y="560" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="682" y="593" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">匹配审核与语义检索</text><text x="682" y="618" font-size="14" fill="#475759" font-weight="400" text-anchor="start">候选裁决 · 按世界线检索</text></g><g class="node" data-node="edit" role="group" aria-label="能力领域，内容生产与出版"><title>把编辑确认的故事交给读者。</title><rect x="954" y="259" width="286" height="83" rx="8" fill="#e5e9e6" stroke="#7a8b89" stroke-width="1.4"/><text x="968" y="279" font-size="13" fill="#425557" font-weight="650" text-anchor="start">能力领域</text><text x="968" y="304" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">内容生产与出版</text><text x="968" y="325" font-size="14" fill="#475759" font-weight="400" text-anchor="start">把编辑确认的故事交给读者</text></g><g class="node" data-node="edit1" role="group" aria-label="已实现，原创内容编入站点"><title>现有作品由仓库中的目录与页面代码提供，随站点交付。读者可以浏览这些内容。</title><rect x="974" y="395" width="266" height="96" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="988" y="415" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="988" y="448" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">原创内容编入站点</text><text x="988" y="473" font-size="14" fill="#475759" font-weight="400" text-anchor="start">角色设定 · 短篇 · 剧情片段</text></g><g class="node" data-node="edit2" role="group" aria-label="待开发，草稿审核与发布"><title>人工创作、编辑委托 Agent 生成或读者授权摘编后进入草稿与审核。发布、撤回和回滚均依赖待建的业务接口。</title><rect x="974" y="540" width="266" height="96" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="988" y="560" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="988" y="593" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">草稿审核与发布</text><text x="988" y="618" font-size="14" fill="#475759" font-weight="400" text-anchor="start">内容 CRUD · 授权摘编 · 版本发布</text></g><line x1="36" y1="677" x2="1244" y2="677" stroke="#c7c7bc"/><text x="36" y="702" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">绿色实线框表示已实现，紫色虚线框表示待开发。分支线表示能力归属。</text><text x="1244" y="702" font-size="13" fill="#546665" font-weight="500" text-anchor="end">2026.11.18</text></svg>
