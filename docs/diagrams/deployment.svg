<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-labelledby="title-deployment desc-deployment" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title-deployment">潮汐邮局 · 部署架构图</title><desc id="desc-deployment">目标拓扑：阿里云面向用户提供 API，腾讯云在独立服务器运行清洗任务。云资源与跨云链路均待部署。 虚线表示未来部署。本地主机上的 Compose 已有 api、sync 和 postgres 三个容器，尚未覆盖跨云网络和任务交接。</desc><defs><marker id="deployment-live" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#47736e"/></marker><marker id="deployment-next" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#986987"/></marker></defs><rect width="1280" height="720" fill="#faf9f4"/><text x="36" y="34" font-size="14" fill="#386862" font-weight="700" text-anchor="start">潮 汐 邮 局   /   DEPLOYMENT</text><text x="36" y="75" font-size="32" fill="#233c43" font-weight="700" text-anchor="start">部署架构图</text><text x="36" y="104" font-size="16" fill="#465a5e" font-weight="400" text-anchor="start">目标拓扑：阿里云面向用户提供 API，腾讯云在独立服务器运行清洗任务。云资源与跨云链路均待部署。</text><line x1="992" y1="65" x2="1022" y2="65" stroke="#aa8954" stroke-width="2"/><text x="1032" y="70" font-size="15" fill="#765929" font-weight="650" text-anchor="start">外部来源</text><line x1="1116" y1="65" x2="1146" y2="65" stroke="#986987" stroke-width="2" stroke-dasharray="5 4"/><text x="1156" y="70" font-size="15" fill="#78476a" font-weight="650" text-anchor="start">待部署</text><rect x="32" y="145" width="590" height="496" rx="10" fill="#f4f4ec" stroke="#bac7c0"/><text x="52" y="182" font-size="21" fill="#315c62" font-weight="650" text-anchor="start">阿里云　/　在线服务</text><rect x="656" y="388" width="588" height="253" rx="10" fill="#f4f4ec" stroke="#bac7c0"/><text x="676" y="425" font-size="21" fill="#315c62" font-weight="650" text-anchor="start">腾讯云　/　数据清洗</text><text x="523" y="385" font-size="14" fill="#465a5e" font-weight="400" text-anchor="middle">内网 SQL</text><text x="962" y="355" font-size="14" fill="#465a5e" font-weight="400" text-anchor="middle">HTTPS 出站</text><text x="640" y="500" font-size="13" fill="#465a5e" font-weight="400" text-anchor="middle">TLS</text><text x="58" y="611" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">清洗停机时，读者仍可查询最后提交的作品版本。</text><text x="684" y="611" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">上游与模型位于云外；断链后按任务键恢复。</text><polyline points="304,261 350,261" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#deployment-next)"><title>HTTPS</title></polyline><polyline points="474,307 474,460" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#deployment-next)"><title>内网 SQL</title></polyline><polyline points="350,506 304,506" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4"><title>同库</title></polyline><polyline points="684,506 598,506" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#deployment-next)"><title>跨云私网 + TLS</title></polyline><polyline points="907,460 907,307" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#deployment-next)"><title>HTTPS 出站</title></polyline><polyline points="932,506 974,506" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#deployment-next)"><title>写入 / 回放</title></polyline><g class="node" data-node="entry" role="group" aria-label="待部署，HTTPS 入口"><title>API 服务器提供 HTTPS。后台管理请求鉴权，公开读请求不访问清洗服务器。Web 与 Pi 的实际运行位置可独立选择。</title><rect x="56" y="215" width="248" height="92" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="70" y="235" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待部署</text><text x="70" y="268" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">HTTPS 入口</text><text x="70" y="293" font-size="14" fill="#475759" font-weight="400" text-anchor="start">H5、Pi 与管理员访问</text></g><g class="node" data-node="aliapi" role="group" aria-label="待部署，阿里云 API 服务器"><title>在线工作台经 API 读取数据服务运行记录。定时图片任务由腾讯云数据服务产生。</title><rect x="350" y="215" width="248" height="92" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="364" y="235" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待部署</text><text x="364" y="268" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">阿里云 API 服务器</text><text x="364" y="293" font-size="14" fill="#475759" font-weight="400" text-anchor="start">业务查询 · 运行观测</text></g><g class="node" data-node="db" role="group" aria-label="待部署，PostgreSQL 主库"><title>建议在阿里云部署唯一权威库，保存已提交作品、来源、治理任务和审计。使用独立数据库角色。</title><rect x="350" y="460" width="248" height="92" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="364" y="480" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待部署</text><text x="364" y="513" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">PostgreSQL 主库</text><text x="364" y="538" font-size="14" fill="#475759" font-weight="400" text-anchor="start">建议靠近 API 部署</text></g><g class="node" data-node="tasks" role="group" aria-label="待开发，任务记录与运行结果"><title>存储归数据服务管理的运行记录与未来图片任务，API 读取状态。模型调用和步骤通过执行 ID 对齐。</title><rect x="56" y="460" width="248" height="92" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="70" y="480" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="70" y="513" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">任务记录与运行结果</text><text x="70" y="538" font-size="14" fill="#475759" font-weight="400" text-anchor="start">同一 PostgreSQL 内的表</text></g><g class="node" data-node="upstream" role="group" aria-label="外部来源，上游与模型服务"><title>这些是腾讯云清洗服务器通过 HTTPS 访问的外部依赖，不属于腾讯云托管资源。</title><rect x="684" y="215" width="248" height="92" rx="8" fill="#f2eadb" stroke="#aa8954" stroke-width="1.4"/><text x="698" y="235" font-size="13" fill="#765929" font-weight="650" text-anchor="start">外部来源</text><text x="698" y="268" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">上游与模型服务</text><text x="698" y="293" font-size="14" fill="#475759" font-weight="400" text-anchor="start">GitHub · npm · TypeSafe</text></g><g class="node" data-node="txclean" role="group" aria-label="待部署，腾讯云数据服务器"><title>数据服务自动调度同步与质量检查。图片优化计划由此创建业务任务，调用 Pi 完成 Agent 步骤，再按规则自动发布或回退。</title><rect x="684" y="460" width="248" height="92" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="698" y="480" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待部署</text><text x="698" y="513" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">腾讯云数据服务器</text><text x="698" y="538" font-size="14" fill="#475759" font-weight="400" text-anchor="start">定时治理 · 图片任务归属</text></g><g class="node" data-node="archive" role="group" aria-label="待部署，清洗侧快照存储"><title>先使用清洗服务器持久盘并独立备份；具体对象存储选型后续确定。API 通过数据库查询归档元数据。</title><rect x="974" y="460" width="248" height="92" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="988" y="480" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待部署</text><text x="988" y="513" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">清洗侧快照存储</text><text x="988" y="538" font-size="14" fill="#475759" font-weight="400" text-anchor="start">摘要寻址 · 版本回放</text></g><line x1="36" y1="677" x2="1244" y2="677" stroke="#c7c7bc"/><text x="36" y="702" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">虚线表示未来部署。本地主机上的 Compose 已有 api、sync 和 postgres 三个容器，尚未覆盖跨云网络和任务交接。</text><text x="1244" y="702" font-size="13" fill="#546665" font-weight="500" text-anchor="end">2026.11.18</text></svg>
