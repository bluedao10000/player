<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Folio 时光 · 产品与系统架构</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f6f6ee;color:#193d38;font:16px/1.55 system-ui,"PingFang SC",sans-serif}
main{width:min(1400px,100%);margin:auto;padding:24px clamp(16px,3vw,44px)}h1,h2{line-height:1.2}h1{font:600 clamp(28px,4vw,48px) Georgia,"Songti SC",serif;margin:8px 0}a{color:#215e5a;overflow-wrap:anywhere}
nav,.controls{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}button{font:inherit;color:inherit;background:transparent;border:1px solid #96a79b;border-radius:6px;padding:6px 12px;cursor:pointer}button[aria-pressed=true]{color:white;background:#224b42}
.layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(240px,290px);gap:24px;align-items:start}.frame{overflow:auto;border:1px solid #bccac1;background:#fafbf7;border-radius:8px;padding:12px;text-align:center}.frame svg{display:block;margin:auto;max-width:100%;height:auto}.frame .node{cursor:pointer}.frame .node[aria-pressed=true] .label-container,.frame .node:focus-visible .label-container{stroke:#91593b!important;stroke-width:3!important}
.frame.actual svg{max-width:none}aside{position:sticky;top:14px}aside h2{font-size:21px;margin:4px 0 12px}.meta{color:#536b62}.links{display:flex;flex-wrap:wrap;gap:12px}a:focus-visible,button:focus-visible{outline:3px solid #91593b}
@media(max-width:760px){main{padding:12px}.layout{grid-template-columns:1fr;gap:12px}.frame{max-height:58vh}aside{position:static}.controls{margin:8px 0}}
</style>
<main><a href="README.md">项目文档</a><h1>Folio 时光 架构图集</h1><p>读者沿人物和场景进入故事。数据服务把作品档案、分集证据和插画整理为可发布的知识。</p>
<p class="meta">实现基线 · main / b5c0151 与四节点 Mesh、每日备份工作树 · 2026-11-21　<a href="架构实现核验.md">核验记录</a></p>
<nav aria-label="选择视图"></nav>
<div class="layout"><div class="frame" tabindex="0" aria-label="可滚动架构图"></div><aside aria-live="polite">
<div class="meta" id="count"></div><h2 id="name"></h2><p id="detail"></p><a id="src"></a>
<div class="controls"><button id="prev">上一节点</button><button id="next">下一节点</button><button id="zoom" aria-pressed="false">原尺寸</button></div>
<div class="links"><a id="svg">查看 SVG</a><a id="mmd">Mermaid 图源</a></div></aside></div></main>
<script>
const views = /* ATLAS_DATA */ []
const find=s=>document.querySelector(s)
let active=0,position=0,nodes=[]
function selectNode(index,scroll){
  position=index
  const el=nodes[index],view=views[active],item=view.nodes[el.dataset.node]
  nodes.forEach((n,i)=>n.setAttribute('aria-pressed',String(i===index)))
  find('#count').textContent=view.title+' · '+(index+1)+' / '+nodes.length
  find('#name').textContent=el.getAttribute('aria-label')
  find('#detail').textContent=item.detail
  find('#src').textContent=item.file
  find('#src').href='../'+item.file
  find('#prev').disabled=index===0
  find('#next').disabled=index===nodes.length-1
  if(scroll)el.scrollIntoView({block:'nearest',inline:'nearest'})
}
function show(index){
  active=index
  const view=views[index],frame=find('.frame')
  frame.innerHTML=view.svg
  frame.scrollTop=frame.scrollLeft=0
  nodes=Object.keys(view.nodes).map(id=>frame.querySelector('[data-node="'+id+'"]'))
  nodes.forEach((el,i)=>{
    el.setAttribute('tabindex','0');el.setAttribute('role','button')
    el.setAttribute('aria-label',el.querySelector('.label')?.textContent.trim()||el.dataset.node)
    el.onclick=()=>selectNode(i,false)
    el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();selectNode(i,false)}}
  })
  document.querySelectorAll('nav button').forEach((b,i)=>b.setAttribute('aria-pressed',String(i===index)))
  find('#svg').href='diagrams/'+view.key+'.svg';find('#mmd').href=view.source;selectNode(0,false)
}
views.forEach((view,i)=>{const b=document.createElement('button');b.textContent=view.title;b.onclick=()=>show(i);find('nav').append(b)})
const actual=matchMedia('(max-width:760px)').matches
find('.frame').classList.toggle('actual',actual);find('#zoom').setAttribute('aria-pressed',String(actual))
find('#zoom').onclick=()=>find('#zoom').setAttribute('aria-pressed',String(find('.frame').classList.toggle('actual')))
find('#prev').onclick=()=>selectNode(position-1,true);find('#next').onclick=()=>selectNode(position+1,true);if(views.length)show(0)
</script></html>
