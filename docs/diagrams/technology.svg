<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 872" aria-labelledby="title-technology desc-technology" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title-technology">潮汐邮局 · 技术架构图</title><desc id="desc-technology">数据服务定时清洗双源快照，在 PostgreSQL 生成统一作品知识库；前端和 Pi 通过 Gin 查询已提交版本。 首次导入生成作品库；增量版本以事务更新。作品查询读取 PostgreSQL，Pi 执行检查点使用独立 SQLite。</desc><defs><marker id="technology-live" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#47736e"/></marker><marker id="technology-next" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#986987"/></marker></defs><rect width="1280" height="872" fill="#faf9f4"/><text x="36" y="34" font-size="14" fill="#386862" font-weight="700" text-anchor="start">潮 汐 邮 局   /   SYSTEM</text><text x="36" y="75" font-size="32" fill="#233c43" font-weight="700" text-anchor="start">技术架构图</text><text x="36" y="104" font-size="16" fill="#465a5e" font-weight="400" text-anchor="start">数据服务定时清洗双源快照，在 PostgreSQL 生成统一作品知识库；前端和 Pi 通过 Gin 查询已提交版本。</text><line x1="1000" y1="65" x2="1030" y2="65" stroke="#317167" stroke-width="2"/><text x="1040" y="70" font-size="15" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><line x1="1120" y1="65" x2="1150" y2="65" stroke="#986987" stroke-width="2" stroke-dasharray="5 4"/><text x="1160" y="70" font-size="15" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><rect x="28" y="131" width="1224" height="115" rx="10" fill="#f2f3ec" stroke="#bdcac2"/><text x="48" y="174" font-size="21" fill="#2d5557" font-weight="650" text-anchor="start">前端</text><text x="48" y="201" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">TanStack Start</text><rect x="28" y="277" width="1224" height="325" rx="10" fill="#f2f3ec" stroke="#bdcac2"/><text x="48" y="320" font-size="21" fill="#2d5557" font-weight="650" text-anchor="start">后端</text><text x="48" y="347" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">Go · 两个服务</text><rect x="28" y="642" width="1224" height="151" rx="10" fill="#f2f3ec" stroke="#bdcac2"/><text x="48" y="685" font-size="21" fill="#2d5557" font-weight="650" text-anchor="start">Agent 端</text><text x="48" y="712" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">Pi Durable · TS</text><text x="210" y="304" font-size="17" fill="#315c62" font-weight="650" text-anchor="start">API 服务　/　目标部署：阿里云</text><text x="750" y="304" font-size="17" fill="#315c62" font-weight="650" text-anchor="start">数据服务　/　目标部署：腾讯云</text><line x1="729" y1="290" x2="729" y2="436" stroke="#c7c7bc"/><text x="1130" y="626" font-size="13" fill="#465a5e" font-weight="400" text-anchor="start">资产 ID</text><text x="805" y="611" font-size="13" fill="#795471" font-weight="500" text-anchor="middle">任务 ID / 执行契约</text><text x="48" y="515" font-size="17" fill="#315c62" font-weight="650" text-anchor="start">知识库生成链</text><text x="48" y="541" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">数据流　←</text><text x="345" y="457" font-size="13" fill="#465a5e" font-weight="400" text-anchor="start">查询</text><text x="870" y="457" font-size="13" fill="#465a5e" font-weight="400" text-anchor="start">触发导入</text><polyline points="330,230 330,260 445,260 445,329" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>读取知识</title></polyline><polyline points="449,730 484,730" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#technology-next)"><title>运行</title></polyline><polyline points="707,730 750,730" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#technology-next)"><title>生成候选</title></polyline><polyline points="973,730 990,730" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#technology-next)"><title>检测候选</title></polyline><polyline points="1198,688 1198,630 1240,630 1240,372 1232,372" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#technology-next)"><title>读写资产与检测结果</title></polyline><polyline points="596,230 596,329" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>轮询遥测</title></polyline><polyline points="990,396 981,396 981,615 596,615 596,688" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#technology-next)"><title>数据服务委托执行</title></polyline><polyline points="990,371 973,371" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4"><title>定时调度与回写</title></polyline><polyline points="990,531 973,531" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>新快照</title></polyline><polyline points="860,413 860,489" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>定时触发</title></polyline><polyline points="750,531 707,531" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>验证完整批次</title></polyline><polyline points="484,531 449,531" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>生成或更新</title></polyline><polyline points="332,413 332,489" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>查询已提交作品</title></polyline><polyline points="212,724 184,724 184,371 212,371" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>知识查询</title></polyline><g class="node" data-node="web" role="group" aria-label="已实现，内容 H5"><title>作品查询经 Gin。公开故事目前读取站点目录。</title><rect x="212" y="146" width="237" height="84" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="226" y="166" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="226" y="191" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">内容 H5</text><text x="226" y="212" font-size="14" fill="#475759" font-weight="400" text-anchor="start">SSR · 角色与故事 · 作品查询</text></g><g class="node" data-node="studio" role="group" aria-label="已实现，数据工作台 · Web"><title>MVP 可观察同步与质检。图片拓扑标明规划状态；没有虚构模型调用或图片运行记录。</title><rect x="492" y="146" width="248" height="84" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="506" y="166" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="506" y="191" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">数据工作台 · Web</text><text x="506" y="212" font-size="14" fill="#475759" font-weight="400" text-anchor="start">只读拓扑 · 批次日志 · 自动刷新</text></g><g class="node" data-node="api" role="group" aria-label="已实现，Gin API"><title>已提供知识查询与治理接口。质检与判同仍有部分在请求内执行，计划迁入数据服务。</title><rect x="212" y="329" width="237" height="84" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="226" y="349" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="226" y="374" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">Gin API</text><text x="226" y="395" font-size="14" fill="#475759" font-weight="400" text-anchor="start">鉴权 · 知识与治理接口</text></g><g class="node" data-node="jobs" role="group" aria-label="已实现，运行观测 API"><title>Gin 提供只读运行记录。前端读取 API，数据服务自行调度执行。</title><rect x="484" y="329" width="223" height="84" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="498" y="349" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="498" y="374" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">运行观测 API</text><text x="498" y="395" font-size="14" fill="#475759" font-weight="400" text-anchor="start">同步记录 · 质检报告</text></g><g class="node" data-node="data" role="group" aria-label="已实现，定时同步调度"><title>每分钟检查到期状态。来源默认每六小时探测一次，版本变化时启动导入。同一 Worker 独立调度提交后的质量检查。</title><rect x="750" y="329" width="223" height="84" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="764" y="349" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="764" y="374" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">定时同步调度</text><text x="764" y="395" font-size="14" fill="#475759" font-weight="400" text-anchor="start">knowledge-sync · 按源探测</text></g><g class="node" data-node="assets" role="group" aria-label="待开发，图片任务与优化流程"><title>数据服务拥有业务任务、参考版本、审核策略、预算、返工上限、资产与发布指针。通过任务契约调用 Agent 层 Pi。</title><rect x="990" y="329" width="242" height="84" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1004" y="349" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="1004" y="374" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">图片任务与优化流程</text><text x="1004" y="395" font-size="14" fill="#475759" font-weight="400" text-anchor="start">任务归属 · 预算 · 发布策略</text></g><g class="node" data-node="pi" role="group" aria-label="已实现，Pi Durable 运行时"><title>已验证 Harness 用同一 SQLite 文件重启并调用 resume；两个已注册的知识工具可通过 Gin 检索和读取作品。图片任务中断后的恢复须在图片工作流接入后另行验证。</title><rect x="212" y="688" width="237" height="84" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="226" y="708" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="226" y="733" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">Pi Durable 运行时</text><text x="226" y="754" font-size="14" fill="#475759" font-weight="400" text-anchor="start">SQLite 重开 · 两个知识工具</text></g><g class="node" data-node="flow" role="group" aria-label="待开发，Pi 工作流与 Harness"><title>Pi 只承接图片优化中需要 Agent 的执行段：按任务契约调用模型与工具、返还证据和检查点。任务生命周期及最终发布决定归数据服务。</title><rect x="484" y="688" width="223" height="84" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="498" y="708" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="498" y="733" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">Pi 工作流与 Harness</text><text x="498" y="754" font-size="14" fill="#475759" font-weight="400" text-anchor="start">工具路由 · 检查点 · 恢复</text></g><g class="node" data-node="gen" role="group" aria-label="待开发，生成与重生成工具"><title>计划在 Pi 注册生成工具。已验证的 Go CLI 通过 OpenAI 图片接口完成九张参考图试稿，可复用适配逻辑；工具调用以任务、轮次与候选键去重。</title><rect x="750" y="688" width="223" height="84" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="764" y="708" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="764" y="733" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">生成与重生成工具</text><text x="764" y="754" font-size="14" fill="#475759" font-weight="400" text-anchor="start">参考图 + 指令 → 图片服务</text></g><g class="node" data-node="validate" role="group" aria-label="待开发，评估与返工工具"><title>数据服务产出规则和裁切结果；Pi 针对不确定项调用 Jev。未通过返回具体返工原因。作品判同现有 Jev 接入与图片审核是两种任务。</title><rect x="990" y="688" width="242" height="84" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="1004" y="708" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="1004" y="733" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">评估与返工工具</text><text x="1004" y="754" font-size="14" fill="#475759" font-weight="400" text-anchor="start">规则优先 · 存疑再问 Jev</text></g><g class="node" data-node="knowledge" role="group" aria-label="已实现，作品知识库"><title>保存 canonical 作品、原名与别名、外部 ID、播出和关系。来源记录和版本保留溯源信息；人工覆盖独立于上游。H5 与 Pi 均经 Gin 查询。</title><rect x="212" y="489" width="237" height="84" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="226" y="509" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="226" y="534" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">作品知识库</text><text x="226" y="555" font-size="14" fill="#475759" font-weight="400" text-anchor="start">PostgreSQL · works / UUID</text></g><g class="node" data-node="merge" role="group" aria-label="已实现，作品匹配与事务发布"><title>校验完整批次，用无冲突的外部 ID 匹配；弱匹配保留候选。在同一事务中更新来源与作品投影。</title><rect x="484" y="489" width="223" height="84" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="498" y="509" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="498" y="534" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">作品匹配与事务发布</text><text x="498" y="555" font-size="14" fill="#475759" font-weight="400" text-anchor="start">来源记录 → 统一作品</text></g><g class="node" data-node="clean" role="group" aria-label="已实现，清洗与归一化"><title>下载到临时文件，核验摘要，按来源契约解析并暂存。仅验证通过的完整批次可提交。</title><rect x="750" y="489" width="223" height="84" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="764" y="509" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="764" y="534" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">清洗与归一化</text><text x="764" y="555" font-size="14" fill="#475759" font-weight="400" text-anchor="start">校验 · 解析 · raw / norm 暂存</text></g><g class="node" data-node="upstream" role="group" aria-label="外部来源，双源作品快照"><title>AOD 发布 JSONL，Bangumi 通过官方 npm 发布包分发 dist/data.json。</title><rect x="990" y="489" width="242" height="84" rx="8" fill="#f2eadb" stroke="#aa8954" stroke-width="1.4"/><text x="1004" y="509" font-size="13" fill="#765929" font-weight="650" text-anchor="start">外部来源</text><text x="1004" y="534" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">双源作品快照</text><text x="1004" y="555" font-size="14" fill="#475759" font-weight="400" text-anchor="start">AOD / GitHub · Bangumi / npm</text></g><line x1="36" y1="829" x2="1244" y2="829" stroke="#c7c7bc"/><text x="36" y="854" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">首次导入生成作品库；增量版本以事务更新。作品查询读取 PostgreSQL，Pi 执行检查点使用独立 SQLite。</text><text x="1244" y="854" font-size="13" fill="#546665" font-weight="500" text-anchor="end">2026.11.18</text></svg>
