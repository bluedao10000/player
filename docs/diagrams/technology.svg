<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" aria-labelledby="title-technology desc-technology" font-family="PingFang SC, Microsoft YaHei, Arial, sans-serif"><title id="title-technology">潮汐邮局 · 技术架构图</title><desc id="desc-technology">知识同步和查询已贯通。原创故事、浏览器进度与 Agent 检查点分别由各自组件保存。 Docker Compose 运行 PostgreSQL、Gin、同步 Worker。Web 与 Pi 可由本地 Node 进程启动。虚线表示规划中的集成或扩展。</desc><defs><marker id="technology-live" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#47736e"/></marker><marker id="technology-next" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L8 4 L0 8 Z" fill="#986987"/></marker></defs><rect width="1280" height="720" fill="#faf9f4"/><text x="36" y="34" font-size="14" fill="#386862" font-weight="700" text-anchor="start">潮 汐 邮 局   /   SYSTEM</text><text x="36" y="75" font-size="32" fill="#233c43" font-weight="700" text-anchor="start">技术架构图</text><text x="36" y="104" font-size="16" fill="#465a5e" font-weight="400" text-anchor="start">知识同步和查询已贯通。原创故事、浏览器进度与 Agent 检查点分别由各自组件保存。</text><line x1="1000" y1="65" x2="1030" y2="65" stroke="#317167" stroke-width="2"/><text x="1040" y="70" font-size="15" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><line x1="1120" y1="65" x2="1150" y2="65" stroke="#986987" stroke-width="2" stroke-dasharray="5 4"/><text x="1160" y="70" font-size="15" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="36" y="143" font-size="16" fill="#315c62" font-weight="650" text-anchor="start">知识写入　·　数据流向 →</text><text x="36" y="329" font-size="16" fill="#315c62" font-weight="650" text-anchor="start">应用访问　·　查询与服务依赖</text><text x="36" y="514" font-size="16" fill="#315c62" font-weight="650" text-anchor="start">本地状态与 Agent 执行</text><text x="952" y="290" font-size="13" fill="#496068" font-weight="500" text-anchor="middle">pgx 查询</text><text x="819" y="482" font-size="13" fill="#795471" font-weight="500" text-anchor="middle">投递剧情命令</text><text x="790" y="652" font-size="13" fill="#795471" font-weight="500" text-anchor="middle">调用模型</text><polyline points="309,208 345,208" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>发布物</title></polyline><polyline points="618,208 654,208" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>暂存与校验</title></polyline><polyline points="927,208 963,208" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>事务归并</title></polyline><polyline points="309,395 345,395" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>server fn</title></polyline><polyline points="618,395 654,395" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>HTTP GET</title></polyline><polyline points="790,345 790,295 1099,295 1099,258" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>查询</title></polyline><polyline points="266,445 266,532" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>读取正文或本机状态</title></polyline><polyline points="481,532 481,445" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>只读工具</title></polyline><polyline points="618,582 654,582" fill="none" stroke="#47736e" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#technology-live)"><title>检查点</title></polyline><polyline points="927,395 963,395" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4"><title>规划扩展</title></polyline><polyline points="1099,445 1099,486 561,486 561,532" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#technology-next)"><title>投递命令</title></polyline><polyline points="481,632 481,657 1099,657 1099,632" fill="none" stroke="#986987" stroke-width="1.6" stroke-linejoin="round" stroke-dasharray="6 4" marker-end="url(#technology-next)"><title>调用模型</title></polyline><g class="node" data-node="sources" role="group" aria-label="外部来源，双源作品数据"><title>anime-offline-database 从 GitHub Release 发布 JSONL。bangumi-data 使用 npm 官方包内的 dist/data.json。来源地址与更新频率可在知识库中配置。</title><rect x="36" y="158" width="273" height="100" rx="8" fill="#f2eadb" stroke="#aa8954" stroke-width="1.4"/><text x="50" y="178" font-size="13" fill="#765929" font-weight="650" text-anchor="start">外部来源</text><text x="50" y="211" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">双源作品数据</text><text x="50" y="236" font-size="14" fill="#475759" font-weight="400" text-anchor="start">AOD (GitHub) / bangumi-data (npm)</text></g><g class="node" data-node="worker" role="group" aria-label="已实现，Go 同步 Worker"><title>独立进程检查配置与元数据，下载并校验，流式解析 AOD，在暂存验证通过后执行归并。</title><rect x="345" y="158" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="359" y="178" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="359" y="211" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">Go 同步 Worker</text><text x="359" y="236" font-size="14" fill="#475759" font-weight="400" text-anchor="start">版本探测 · 校验 · Normalize</text></g><g class="node" data-node="stagepg" role="group" aria-label="已实现，PostgreSQL 来源层"><title>staging_source_records 隔离未验证批次。成功合并时持久化来源、版本和 raw/norm 记录，同时提交同步统计。</title><rect x="654" y="158" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="668" y="178" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="668" y="211" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">PostgreSQL 来源层</text><text x="668" y="236" font-size="14" fill="#475759" font-weight="400" text-anchor="start">批次暂存 · 源记录 · 版本审计</text></g><g class="node" data-node="works" role="group" aria-label="已实现，PostgreSQL 作品层"><title>来源层和作品层共用 PostgreSQL 17。只在验证后提交事务。works UUID 供业务引用，标题、站点 ID、播出和关系可追溯。</title><rect x="963" y="158" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="977" y="178" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="977" y="211" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">PostgreSQL 作品层</text><text x="977" y="236" font-size="14" fill="#475759" font-weight="400" text-anchor="start">works · 关联数据 · 匹配候选</text></g><g class="node" data-node="web" role="group" aria-label="已实现，TanStack Start"><title>公开故事从仓库目录渲染；知识库页面通过 server function 调用共享客户端。两类数据入口分开。</title><rect x="36" y="345" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="50" y="365" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="50" y="398" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">TanStack Start</text><text x="50" y="423" font-size="14" fill="#475759" font-weight="400" text-anchor="start">H5 / SSR · 知识检索 server fn</text></g><g class="node" data-node="client" role="group" aria-label="已实现，共享知识客户端"><title>H5 服务端与 Pi 工具复用同一个客户端，经 KNOWLEDGE_API_URL 按 UUID 查询 Gin。</title><rect x="345" y="345" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="359" y="365" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="359" y="398" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">共享知识客户端</text><text x="359" y="423" font-size="14" fill="#475759" font-weight="400" text-anchor="start">@anime/shared/knowledge</text></g><g class="node" data-node="gin" role="group" aria-label="已实现，Gin 知识 API"><title>Go 服务通过 pgx 读取 PostgreSQL。作品查询返回 canonical 数据与来源，审计端点能查最近同步和待核对候选。</title><rect x="654" y="345" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="668" y="365" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="668" y="398" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">Gin 知识 API</text><text x="668" y="423" font-size="14" fill="#475759" font-weight="400" text-anchor="start">作品 · 来源 · 运行记录 · 候选</text></g><g class="node" data-node="biz" role="group" aria-label="待开发，Gin 内容与会话 API"><title>规划中的业务域提供角色卡与内容发布，校验会话归属，投递 Agent 命令并提交回合状态。现有 Gin 路由集中于知识查询。</title><rect x="963" y="345" width="273" height="100" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="977" y="365" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="977" y="398" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">Gin 内容与会话 API</text><text x="977" y="423" font-size="14" fill="#475759" font-weight="400" text-anchor="start">内容修订 · owner · Outbox / SSE</text></g><g class="node" data-node="static" role="group" aria-label="已实现，站点目录与浏览器"><title>原创故事来自 TypeScript 目录。读者收藏和演示选择存在浏览器 localStorage，两者独立于作品知识库。</title><rect x="36" y="532" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="50" y="552" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="50" y="585" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">站点目录与浏览器</text><text x="50" y="610" font-size="14" fill="#475759" font-weight="400" text-anchor="start">仓库保存故事 · 本机保存进度</text></g><g class="node" data-node="pi" role="group" aria-label="已实现，Pi Durable 运行时"><title>已初始化持久 Harness，注册 search_anime_works 与 read_anime_work。当前 HTTP 服务仅暴露健康检查。</title><rect x="345" y="532" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="359" y="552" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="359" y="585" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">Pi Durable 运行时</text><text x="359" y="610" font-size="14" fill="#475759" font-weight="400" text-anchor="start">Harness.resume · 两个知识工具</text></g><g class="node" data-node="sqlite" role="group" aria-label="已实现，运行时 SQLite"><title>Pi 单独打开 data/agent.sqlite 并在启动时 resume。正式作品知识的权威存储为 PostgreSQL。</title><rect x="654" y="532" width="273" height="100" rx="8" fill="#e5f0ea" stroke="#317167" stroke-width="1.4"/><text x="668" y="552" font-size="13" fill="#184e46" font-weight="650" text-anchor="start">已实现</text><text x="668" y="585" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">运行时 SQLite</text><text x="668" y="610" font-size="14" fill="#475759" font-weight="400" text-anchor="start">Pi 执行检查点</text></g><g class="node" data-node="llm" role="group" aria-label="待开发，OpenAI 兼容模型"><title>仍需配置模型提供方，接通正式回合或草稿任务，并校验和提交模型输出。</title><rect x="963" y="532" width="273" height="100" rx="8" fill="#f5edf3" stroke="#986987" stroke-width="1.4" stroke-dasharray="6 4"/><text x="977" y="552" font-size="13" fill="#78476a" font-weight="650" text-anchor="start">待开发</text><text x="977" y="585" font-size="20" fill="#243e43" font-weight="650" text-anchor="start">OpenAI 兼容模型</text><text x="977" y="610" font-size="14" fill="#475759" font-weight="400" text-anchor="start">生成剧情回合与故事草稿</text></g><line x1="36" y1="677" x2="1244" y2="677" stroke="#c7c7bc"/><text x="36" y="702" font-size="14" fill="#465a5e" font-weight="400" text-anchor="start">Docker Compose 运行 PostgreSQL、Gin、同步 Worker。Web 与 Pi 可由本地 Node 进程启动。虚线表示规划中的集成或扩展。</text><text x="1244" y="702" font-size="13" fill="#546665" font-weight="500" text-anchor="end">2026.11.18</text></svg>
