<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>读者账户原型 · Folio 时光</title>
<style>
:root{color-scheme:dark;--ink:#f4effa;--muted:#bfbbcb;--lav:#dac6ff;--aqua:#a8d6d5;--line:#373442;--bg:#100f17;--panel:#201e29;font:16px/1.6 Inter,-apple-system,'PingFang SC',sans-serif}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}button,input{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,a:focus-visible,input:focus-visible{outline:2px solid var(--aqua);outline-offset:3px}header,main,footer{max-width:1050px;margin:auto;padding-inline:28px}header{min-height:66px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}header strong{font-size:20px;letter-spacing:.05em}header small,.label{color:var(--aqua);font-size:13px}main{padding-block:38px 64px}h1,h2,h3,p{margin:0}h1,h2,h3,.display{font-family:'Songti SC','STSong',serif}h1{font-size:clamp(34px,5vw,56px);line-height:1.2}h2{font-size:26px}button,.primary,.secondary{min-height:44px;border-radius:14px;padding:8px 18px;font-weight:600}.primary{display:inline-block;border:0;background:var(--lav);color:#21182c}.secondary{background:transparent;border:1px solid var(--line)}.text-link{display:inline-flex;min-height:44px;align-items:center;color:var(--lav);background:none;border:0;padding:2px 0;font-weight:500}.muted,small{color:var(--muted)}.login-grid{display:grid;grid-template-columns:1.05fr 1fr;border-radius:30px;overflow:hidden;background:var(--panel)}.art{position:relative;min-height:500px;background:linear-gradient(0deg,#171222dd,transparent 65%),url('assets/look-back.jpg') center/cover}.art div{position:absolute;bottom:35px;left:32px}.art strong{display:block;font:36px 'Songti SC',serif}.login-body{padding:44px;align-self:center}.login-body h1{font-size:40px}.login-body p{margin:12px 0 20px}.stack{display:grid;gap:12px}.stack input{width:100%;height:48px;background:#16151d;color:var(--ink);border:1px solid #5c566c;padding:8px 12px;border-radius:12px}.stack label{font-size:14px;color:var(--muted)}.title-row,.actions,.section-title{display:flex;align-items:center;justify-content:space-between;gap:14px}.title-row{margin-bottom:26px}.title-row p{color:var(--muted);margin-top:6px}.continue{display:grid;grid-template-columns:1.05fr 1fr;border-radius:26px;background:var(--panel);overflow:hidden}.continue img{width:100%;height:100%;max-height:270px;object-fit:cover}.continue div{padding:28px;align-self:center}.continue strong{display:block;font:clamp(25px,3vw,38px) 'Songti SC',serif;margin:4px 0}.continue p{color:var(--muted);margin:4px 0 17px}.section-title{margin:26px 0 12px}.shelf{display:grid;grid-template-columns:1fr 1fr;gap:18px}.book{display:flex;align-items:center;gap:14px}.book img{width:100px;aspect-ratio:4/3;object-fit:cover;border-radius:12px}.book strong{display:block;font-size:19px}.row{width:100%;display:flex;justify-content:space-between;align-items:center;min-height:54px;border:0;border-bottom:1px solid var(--line);border-radius:0;background:transparent;padding:8px 2px;text-align:left}.row span{color:var(--muted);font-size:14px}.detail{max-width:600px;margin:12px auto}.detail h1{margin:15px 0}.detail p{margin:12px 0}.note{color:var(--muted);font-size:13px}footer{padding-bottom:24px}.error{color:#ffb9ac} [hidden]{display:none!important}
@media(max-width:690px){header,main,footer{padding-inline:18px}header{min-height:54px}main{padding-block:20px 42px}.login-grid,.continue{grid-template-columns:1fr}.art{min-height:158px;background-position:center 43%}.art div{left:18px;bottom:12px}.art strong{font-size:23px}.login-body{padding:24px 20px}.login-body h1{font-size:32px}.continue img{height:156px}.continue div{padding:18px}.title-row{margin-bottom:18px}.title-row h1{font-size:33px}.shelf{gap:12px}.book{display:block}.book img{width:100%;aspect-ratio:1.55}.book strong{font-size:17px}.section-title{margin-top:24px}.actions{flex-wrap:wrap}}
.reader-tabs{display:none}
@media(max-width:690px){body:has(.reader-tabs:not([hidden])){padding-bottom:62px}.reader-tabs:not([hidden]){display:flex;position:fixed;bottom:0;inset-inline:0;justify-content:space-around;background:#15131ef5;border-top:1px solid var(--line);padding:4px 0 max(4px,env(safe-area-inset-bottom));backdrop-filter:blur(12px)}.reader-tabs a{min-height:44px;display:grid;align-content:center;justify-items:center;min-width:48px;color:var(--muted);font-size:12px}.reader-tabs a[aria-current]{color:var(--lav);font-weight:650}.reader-tabs a[aria-current]::before{content:'';width:18px;height:2px;background:var(--lav);margin-bottom:4px}}
</style>
<header><a href="#me"><strong>Folio 时光</strong></a><small>读者账户 · 交互原型</small></header>
<main id="page" tabindex="-1"></main>
<footer><small>设计演示使用样例阅读记录和余额。登录、发码与订单仅在此页模拟。</small></footer>
<nav class="reader-tabs" aria-label="主导航" hidden><a href="https://www.codeiy.com/">发现</a><a href="https://www.codeiy.com/works">作品</a><a href="https://www.codeiy.com/characters">角色</a><a href="https://www.codeiy.com/stories">故事</a><a href="#me" aria-current="page">我的</a></nav>
<script>
const root=document.querySelector('#page')
const site='https://www.codeiy.com'
const book='/work/takopi-ona-2025',film='/work/look-back-film-2024'
const chapter=book+'/chapter/to-you-in-2016#passage-first-thanks'
let signed=false, destination='me', email='reader@example.com', expiry=0
const ways={account:'账户设置'}
function go(name){if(location.hash==='#'+name)render();else location.hash=name}
function requireAccount(name){destination=name;go(signed?name:'login')}
function success(){signed=true;go(destination)}
function logout(){signed=false;destination='me';email='reader@example.com';expiry=0;go('me')}
function canvas(content){return '<section class="login-grid"><aside class="art" aria-label="蓦然回首场景插画"><div><small>动画电影 · 2024</small><strong>蓦然回首</strong></div></aside><div class="login-body">'+content+'</div></section>'}
function catalog(){return '<div class="shelf"><a class="book" href="'+site+film+'"><img src="assets/look-back.jpg" alt=""><strong>蓦然回首</strong><small>全片导读</small></a><a class="book" href="'+site+book+'"><img src="assets/takopi.jpg" alt=""><strong>章鱼哔的原罪</strong><small>全 6 集</small></a></div>'}
function profile(){return '<div class="title-row"><div><h1>我的</h1><p>'+(signed?'小禾 · 读者账户':'访客 · 阅读记录保存在本机')+'</p></div>'+(signed?'<button class="secondary" data-open="account">账户设置</button>':'<button class="primary" data-open="me">登录</button>')+'</div><article class="continue"><img src="assets/takopi.jpg" alt="章鱼哔的原罪第一集场景"><div><small class="label">继续阅读 · 章鱼哔的原罪</small><strong>致2016年的你</strong><p>第 1 集 · 体育仓库外的道谢</p><a class="primary" href="'+site+chapter+'">接着读 →</a></div></article><div class="section-title"><h2>我的书架</h2><a class="text-link" href="#shelf">查看全部 →</a></div>'+catalog()}
function render(){
 const key=location.hash.slice(1)||'me'
 let markup=''
 if(key==='me'){markup=profile()}
 else if(key==='login'){markup=canvas('<h1>登录 Folio 时光</h1><p class="muted">在不同设备上接着读，找回收藏的作品。</p><div class="stack"><button class="primary" data-go="wechat">微信登录</button><button class="secondary" data-go="email">邮箱验证码登录</button></div><a class="text-link" href="#me">暂时跳过，回到我的 →</a>')}
 else if(key==='wechat'){markup=canvas('<h1>微信授权</h1><p class="muted">确认后，使用微信身份进入读者账户。</p><div class="stack"><button class="primary" id="approve">模拟授权成功</button><button class="secondary" data-go="login">取消授权</button></div>')}
 else if(key==='email'){markup=canvas('<h1>邮箱登录</h1><p class="muted">用示例邮箱体验验证码登录。</p><form id="send" class="stack"><label for="mail">邮箱</label><input id="mail" type="email" required autocomplete="off"><button class="primary">获取演示验证码</button></form><a class="text-link" href="#login">其他登录方式</a>')}
 else if(key==='code'){if(!expiry){go('email');return}markup=canvas('<h1>输入验证码</h1><p>示例邮箱 <b id="address"></b><br><small>演示码 246810，5 分钟内有效。</small></p><form class="stack" id="check"><label for="otp">六位验证码</label><input id="otp" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" required><div id="error" class="error" role="alert"></div><button class="primary">确认登录</button></form><div class="actions"><a class="text-link" href="#email">修改邮箱</a><button class="text-link" id="resend">重新获取</button></div>')}
 else if(key==='shelf'){markup='<section class="detail"><a class="text-link" href="#me">← 我的</a><h1>我的书架</h1>'+catalog()+'</section>'}
 else if(ways[key]){if(!signed){requireAccount(key);return}const info={account:'<div class="row">读者昵称<span>小禾</span></div><div class="row">登录方式<span id="method"></span></div><p><button class="secondary" id="out">退出登录</button></p>'}
 markup='<section class="detail"><a class="text-link" href="#me">← 我的</a><h1>'+ways[key]+'</h1>'+info[key]+'</section>'}
 else{go('me');return}
 document.querySelector('.reader-tabs').hidden=!['me','shelf','account'].includes(key)
 root.innerHTML=markup
 root.querySelectorAll('[data-open]').forEach(el=>el.onclick=()=>requireAccount(el.dataset.open))
 root.querySelectorAll('[data-go]').forEach(el=>el.onclick=()=>go(el.dataset.go))
 const by=id=>document.getElementById(id)
 if(by('approve'))by('approve').onclick=()=>{method='微信';success()}
 if(by('send')){by('mail').value=email;by('send').onsubmit=e=>{e.preventDefault();email=by('mail').value;expiry=Date.now()+300000;go('code')}}
 if(by('check')){by('address').textContent=email;by('check').onsubmit=e=>{e.preventDefault();if(Date.now()>=expiry)by('error').textContent='验证码已过期，请重新获取。';else if(by('otp').value!=='246810')by('error').textContent='验证码不正确，请再试一次。';else{method='邮箱验证码';success()}};by('resend').onclick=()=>{expiry=Date.now()+300000;by('otp').value='';by('error').textContent='已更新演示码，仍为 246810。';by('otp').focus()}}
 if(by('out')){by('method').textContent=method;by('out').onclick=logout}
 window.scrollTo(0,0);root.focus({preventScroll:true})
}
let method=''
window.addEventListener('hashchange',render);render()
</script></html>
