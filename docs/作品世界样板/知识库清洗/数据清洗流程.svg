<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 972 904" width="972" height="904" role="img" aria-labelledby="diagramTitle diagramDesc"><title id="diagramTitle">从数据来源到作品知识库</title><desc id="diagramDesc">三条支路分别处理通用作品目录、潮汐邮局原创内容和星际牛仔导读。基础目录可单独检索，只有接入内容的作品才会发布角色、章节和场景关系。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8Z" fill="#53706b"/></marker></defs><rect width="972" height="904" fill="#faf9f3"/><g font-family="PingFang SC,Microsoft YaHei,Arial,sans-serif"><text x="28" y="55" font-size="38" fill="#203a37" font-weight="680" text-anchor="start">一部作品怎样进入知识库</text><text x="30" y="86" font-size="16" fill="#536c66" font-weight="400" text-anchor="start">本地运行实况   /   2026.11.18</text><rect x="26" y="107" width="920" height="58" rx="12" fill="#254941" stroke="#254941"/><text x="486" y="143" font-size="22" fill="#ffffff" font-weight="600" text-anchor="middle">数据服务定时检查各来源，登记同步批次</text><path d="M168 165V198" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M483 165V198" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M801 165V198" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="26" y="200" width="282" height="119" rx="12" fill="#e4efea" stroke="#8daea2"/><text x="43" y="233" font-size="22" fill="#203a37" font-weight="650" text-anchor="start">通用作品目录</text><text x="43" y="263" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">anime-offline-database</text><text x="43" y="286" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">bangumi-data 发行包</text><rect x="342" y="200" width="282" height="119" rx="12" fill="#f6eddd" stroke="#c9ad7c"/><text x="359" y="233" font-size="22" fill="#203a37" font-weight="650" text-anchor="start">潮汐邮局 · 原创来源</text><text x="359" y="263" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">自有清单包含四篇短篇全文、</text><text x="359" y="286" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">人物、场景和导读编排。</text><rect x="658" y="200" width="288" height="119" rx="12" fill="#eeeaf5" stroke="#aea2c5"/><text x="675" y="233" font-size="22" fill="#203a37" font-weight="650" text-anchor="start">星际牛仔 · 编辑来源</text><text x="675" y="263" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">站内清单提供中文导读、</text><text x="675" y="286" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">场景说明和候选出场关系。</text><path d="M168 319V349" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M483 319V349" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M801 319V349" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="26" y="351" width="282" height="120" rx="12" fill="#e4efea" stroke="#8daea2"/><text x="43" y="384" font-size="22" fill="#203a37" font-weight="650" text-anchor="start">规范化并暂存</text><text x="43" y="414" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">检版本、下载并校验文件；</text><text x="43" y="437" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">统一标题、集数和外部 ID。</text><rect x="342" y="351" width="282" height="120" rx="12" fill="#f6eddd" stroke="#c9ad7c"/><text x="359" y="384" font-size="22" fill="#203a37" font-weight="650" text-anchor="start">校验原创清单</text><text x="359" y="414" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">检查作品键、章节、非空正文</text><text x="359" y="437" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">及场景所需字段。</text><rect x="658" y="351" width="288" height="120" rx="12" fill="#eeeaf5" stroke="#aea2c5"/><text x="675" y="384" font-size="22" fill="#203a37" font-weight="650" text-anchor="start">核对外部证据</text><text x="675" y="414" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">Bangumi API 核对集序和人名；</text><text x="675" y="437" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">分集简介等核对本集／本幕出场。</text><path d="M168 471V507" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="26" y="509" width="282" height="125" rx="12" fill="#e4efea" stroke="#8daea2"/><text x="43" y="542" font-size="22" fill="#203a37" font-weight="650" text-anchor="start">归并为作品档案</text><text x="43" y="572" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">以来源 ID 匹配版本，保留来源。</text><text x="43" y="595" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">写入作品 UUID、译名、类型、</text><text x="43" y="618" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">集数、制作机构等已有资料。</text><path d="M483 471V507" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M801 471V507" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="342" y="509" width="604" height="125" rx="12" fill="#eeeaf5" stroke="#aea2c5"/><text x="359" y="542" font-size="22" fill="#203a37" font-weight="650" text-anchor="start">将可读内容挂到确定的作品版本</text><text x="359" y="572" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">原创按自有来源键建档或复用；《星际牛仔》关联 1998 TV 版。</text><text x="359" y="595" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">内容有变化才暂存。写入时检查：场景属于哪一章、回到哪一段，</text><text x="359" y="618" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">幕内人物是否也有该章的出场记录。</text><path d="M308 566H340" fill="none" stroke="#53706b" stroke-width="1.6" stroke-dasharray="5 4" marker-end="url(#arrow)"/><path d="M168 634V675" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><path d="M644 634V675" fill="none" stroke="#53706b" stroke-width="1.6" marker-end="url(#arrow)"/><rect x="26" y="677" width="282" height="118" rx="12" fill="#e4efea" stroke="#8daea2"/><text x="43" y="710" font-size="22" fill="#203a37" font-weight="650" text-anchor="start">Gin → H5 资料检索</text><text x="43" y="740" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">即使只有档案，也可按作品名</text><text x="43" y="763" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">和译名找到对应版本。</text><rect x="342" y="677" width="604" height="118" rx="12" fill="#eeeaf5" stroke="#aea2c5"/><text x="359" y="710" font-size="22" fill="#203a37" font-weight="650" text-anchor="start">事务提交 → Gin → H5 作品世界</text><text x="359" y="740" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">同时发布角色、集／章、正文段落、导读线、场景、地点及出场关系。</text><text x="359" y="763" font-size="16" fill="#203a37" font-weight="400" text-anchor="start">读者可以从角色找到章节，再从一幕返回所属正文。</text><text x="30" y="836" font-size="18" fill="#203a37" font-weight="650" text-anchor="start">运行记录</text><text x="126" y="836" font-size="17" fill="#203a37" font-weight="400" text-anchor="start">版本相同则跳过；校验失败保留上次成功版本。同步记录保存结果和失败原因。</text><text x="30" y="872" font-size="15" fill="#526964" font-weight="400" text-anchor="start">虚线箭头表示作品身份引用。通用目录任务与两个样板的内容任务各自按来源运行。</text></g></svg>