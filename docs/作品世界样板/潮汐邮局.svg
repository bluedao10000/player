<svg xmlns="http://www.w3.org/2000/svg" width="560" height="764" viewBox="0 0 560 764" role="img" aria-labelledby="tidal-title tidal-desc"><title id="tidal-title">潮汐邮局作品关系图</title><desc id="tidal-desc">沿着阿澪的夜间邮路。按箭头从作品、导读和章节读到人物、场景与世界设定。</desc><defs><marker id="tidal-arrow" markerWidth="7" markerHeight="7" refX="6.4" refY="3.5" orient="auto"><path d="M0 0L7 3.5L0 7Z" fill="#5b716d"/></marker></defs><rect width="560" height="764" rx="16" fill="#fcfbf7"/><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><text x="25" y="49" font-size="34" fill="#183b33" font-weight="650" text-anchor="start">潮汐邮局</text><text x="26" y="80" font-size="20" fill="#4b615a" font-weight="400" text-anchor="start">沿着阿澪的夜间邮路</text><rect x="24" y="108" width="512" height="64" rx="9" fill="#e4f1eb" stroke="#357463"/><text x="37" y="131" font-size="15" fill="#163f37" font-weight="500" text-anchor="start">作品 · H5 已有原创内容，作品身份待入库</text><text x="37" y="158" font-size="22" fill="#163f37" font-weight="600" text-anchor="start">潮汐邮局</text><path d="M145 172V215" fill="none" stroke="#5b716d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#tidal-arrow)"/><text x="157" y="200" font-size="16" fill="#415b54" font-weight="400" text-anchor="start">收录</text><rect x="24" y="216" width="240" height="64" rx="9" fill="#f7edf5" stroke="#965a81" stroke-dasharray="6 4"/><text x="37" y="239" font-size="15" fill="#693458" font-weight="500" text-anchor="start">导读线 · 拟定</text><text x="37" y="266" font-size="22" fill="#693458" font-weight="600" text-anchor="start">白帆港夜间邮路</text><path d="M414 172V215" fill="none" stroke="#5b716d" stroke-width="1.6" stroke-linejoin="round" marker-end="url(#tidal-arrow)"/><text x="426" y="200" font-size="16" fill="#415b54" font-weight="400" text-anchor="start">登场人物</text><rect x="296" y="216" width="240" height="64" rx="9" fill="#e4f1eb" stroke="#357463"/><text x="309" y="239" font-size="15" fill="#163f37" font-weight="500" text-anchor="start">角色 · 渡口协作</text>