name: Folio checks
on: [push, pull_request]

permissions:
  contents: read

jobs:
  application:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_PASSWORD: local-test-only
        ports:
          - 5432/tcp
        options: --health-cmd pg_isready --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@v5
        with:
          go-version-file: apps/api/go.mod
          cache-dependency-path: '**/go.sum'
      - run: npm ci
      - run: npm run check
        env:
          KNOWLEDGE_TEST_DATABASE_URL: postgres://postgres:local-test-only@127.0.0.1:${{ job.services.postgres.ports[5432] }}/postgres?sslmode=disable
          GOFLAGS: -p=1
      - run: python3 docs/check.py
      - uses: actions/upload-artifact@v4
        with:
          name: folio-static-site
          path: apps/web/dist/site/
          if-no-files-found: error
  gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build --target test apps/image
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: |
          npm install --prefix "$RUNNER_TEMP/folio-browser" playwright@1.62.1 mermaid@11.17.2
          "$RUNNER_TEMP/folio-browser/node_modules/.bin/playwright" install --with-deps chromium
          NODE_PATH="$RUNNER_TEMP/folio-browser/node_modules" node docs/diagrams/render.cjs --check
          EDGE_SMOKE_BROWSER=1 NODE_PATH="$RUNNER_TEMP/folio-browser/node_modules" deploy/gateway/tests/smoke.sh
