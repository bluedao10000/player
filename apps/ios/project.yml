name: AnimeApp
options:
  deploymentTarget:
    iOS: "17.0"
configs:
  Dev: debug
  Test: debug
  Sandbox: release
  Prod: release
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "5.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: W2NL88VWXP
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1,2"
packages:
  FolioWeChatSDK:
    path: WeChatSDK
targets:
  AnimeApp:
    type: application
    platform: iOS
    dependencies:
      - package: FolioWeChatSDK
        product: WechatOpenSDK
      - sdk: WebKit.framework
      - sdk: libz.tbd
      - sdk: libsqlite3.tbd
      - sdk: libc++.tbd
    configFiles:
      Dev: Config/WeChat.xcconfig
      Test: Config/WeChat.xcconfig
      Sandbox: Config/WeChat.xcconfig
      Prod: Config/WeChat.xcconfig
    info:
      path: Config/Info.plist
      properties:
        CFBundleURLTypes:
          - CFBundleURLSchemes: ["$(WECHAT_IOS_APP_ID)"]
        LSApplicationQueriesSchemes: [weixin, weixinULAPI, weixinURLParamsAPI]
        FolioWechatAppID: "$(WECHAT_IOS_APP_ID)"
        FolioWechatLink: "$(WECHAT_IOS_UNIVERSAL_LINK)"
    entitlements:
      path: Config/Folio.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.developer.associated-domains: ["applinks:$(WECHAT_IOS_LINK_HOST)"]
    sources: [Folio]
    settings:
      base:
        OTHER_LDFLAGS: "$(inherited) -ObjC"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Folio 时光
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
      configs:
        Dev:
          PRODUCT_BUNDLE_IDENTIFIER: com.kmszz.starWiki.dev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FOLIO_DEV"
          INFOPLIST_KEY_CFBundleDisplayName: Folio 时光·开发
        Test:
          PRODUCT_BUNDLE_IDENTIFIER: com.kmszz.starWiki.test
          INFOPLIST_KEY_CFBundleDisplayName: Folio 时光·测试
        Sandbox:
          PRODUCT_BUNDLE_IDENTIFIER: com.kmszz.starWiki
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) FOLIO_SANDBOX"
          INFOPLIST_KEY_CFBundleDisplayName: Folio 时光·沙盒
        Prod:
          PRODUCT_BUNDLE_IDENTIFIER: com.kmszz.starWiki
  StoreTests:
    type: bundle.unit-test
    platform: iOS
    sources: [StoreTests]
    dependencies:
      - target: AnimeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmszz.starWiki.storeTests
        GENERATE_INFOPLIST_FILE: YES
  ReadingUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: AnimeApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kmszz.starWiki.readingUITests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AnimeApp-Dev:
    build:
      targets: {AnimeApp: all}
    run:
      config: Dev
      storeKitConfiguration: StoreTests/Folio.storekit
    test:
      config: Dev
      targets: [StoreTests, ReadingUITests]
    profile: {config: Dev}
    analyze: {config: Dev}
    archive: {config: Dev}
  AnimeApp-Test:
    build:
      targets: {AnimeApp: all}
    run: {config: Test}
    test: {config: Test, targets: [StoreTests, ReadingUITests]}
    profile: {config: Test}
    analyze: {config: Test}
    archive: {config: Test}
  AnimeApp-Sandbox:
    build:
      targets: {AnimeApp: all}
    run: {config: Sandbox}
    profile: {config: Sandbox}
    analyze: {config: Sandbox}
    archive: {config: Sandbox}
  AnimeApp-Prod:
    build:
      targets: {AnimeApp: all}
    run: {config: Prod}
    test: {config: Prod, targets: []}
    profile: {config: Prod}
    analyze: {config: Prod}
    archive: {config: Prod}
