name: tidepost-knowledge
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anime
      POSTGRES_DB: anime_knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - knowledge-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${KNOWLEDGE_PG_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U anime -d anime_knowledge"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      <<: &database
        PGHOST: postgres
        PGDATABASE: anime_knowledge
        PGUSER: anime
        PGPASSWORD: ${POSTGRES_PASSWORD}
        DATABASE_URL: "postgresql:///?sslmode=disable"
        KNOWLEDGE_ARCHIVE_DIR: /var/lib/knowledge/archive
      KNOWLEDGE_ADMIN_TOKEN: ${KNOWLEDGE_ADMIN_TOKEN:-}
      KNOWLEDGE_ADMIN_OPERATOR: ${KNOWLEDGE_ADMIN_OPERATOR:-}
      MATCH_AI_ACCOUNT: ${MATCH_AI_ACCOUNT:-default}
      MATCH_AI_BASE_URL: ${MATCH_AI_BASE_URL:-}
      MATCH_AI_PROVIDER: ${MATCH_AI_PROVIDER:-openai}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_ACCOUNT: ${TYPESAFE_ACCOUNT:-default}
      TYPESAFE_BASE_URL: ${TYPESAFE_BASE_URL:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      MATCH_AI_MODEL: ${MATCH_AI_MODEL:-}
      MATCH_AI_API_KEY: ${MATCH_AI_API_KEY:-}
      API_HOST: 0.0.0.0
    volumes:
      - knowledge-archive:/var/lib/knowledge/archive
      - media-assets:/media:ro
    ports:
      - "127.0.0.1:${KNOWLEDGE_API_PORT:-4321}:4311"
    depends_on:
      postgres:
        condition: service_healthy
  media-preview:
    profiles: ["billing-tools"]
    build: ./apps/api
    entrypoint: ["media", "generate-preview"]
    environment: &preview-environment
      <<: *database
      MEDIA_AI_API_KEY: ${MEDIA_AI_API_KEY:-}
      MEDIA_AI_BASE_URL: ${MEDIA_AI_BASE_URL:-}
      MEDIA_AI_MODEL: ${MEDIA_AI_MODEL:-}
      MEDIA_AI_ACCOUNT: ${MEDIA_AI_ACCOUNT:-default}
      XDG_CACHE_HOME: /var/lib/knowledge/archive/preview-cache
    volumes:
      - knowledge-archive:/var/lib/knowledge/archive
  reader-orders:
    profiles: ["reader-sales"]
    build: ./apps/api
    command: ["media", "process-orders"]
    environment: *preview-environment
    volumes:
      - knowledge-archive:/var/lib/knowledge/archive
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
  research-agent:
    build:
      context: .
      dockerfile: apps/agent/Dockerfile
    restart: unless-stopped
    environment:
      AGENT_HOST: 0.0.0.0
      AGENT_DB_PATH: /state/agent.sqlite
      OPENAI_API_KEY: ${RESEARCH_OPENAI_API_KEY:-}
      CONTENT_AI_API_KEY: ${CONTENT_AI_API_KEY:-}
      CONTENT_AI_ACCOUNT: ${CONTENT_AI_ACCOUNT:-default}
      CONTENT_AI_BASE_URL: ${CONTENT_AI_BASE_URL:-}
      CONTENT_AI_MODEL: ${CONTENT_AI_MODEL:-}
      CONTENT_AI_PROTOCOL: ${CONTENT_AI_PROTOCOL:-responses}
      VISION_AI_API_KEY: ${VISION_AI_API_KEY:-}
      VISION_AI_ACCOUNT: ${VISION_AI_ACCOUNT:-default}
      VISION_AI_BASE_URL: ${VISION_AI_BASE_URL:-}
      VISION_AI_MODEL: ${VISION_AI_MODEL:-}
      VISION_AI_SECOND_MODEL: ${VISION_AI_SECOND_MODEL:-}
      MEDIA_AI_ACCOUNT: ${MEDIA_AI_ACCOUNT:-default}
      MEDIA_AI_BASE_URL: ${MEDIA_AI_BASE_URL:-}
      MEDIA_AI_API_KEY: ${MEDIA_AI_API_KEY:-}
      MEDIA_AI_MODEL: ${MEDIA_AI_MODEL:-gpt-image-2}
      MEDIA_SECOND_REVIEW_MODEL: ${MEDIA_SECOND_REVIEW_MODEL:-gpt-4.1}
      MEDIA_REVIEW_MODEL: ${MEDIA_REVIEW_MODEL:-gpt-4.1-mini}
      RESEARCH_MODEL: ${RESEARCH_MODEL:-gpt-4.1-mini}
    volumes:
      - research-state:/state
      - media-assets:/media
      - ./apps/web/public/art/mio-invitation.webp:/mio-reference.webp:ro
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4312/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 3s
      retries: 12
  sync:
    build: ./apps/api
    command: ["knowledge-sync"]
    volumes:
      - media-assets:/media:ro
      - ./data/episode-plans:/episode-plans:ro
      - ./apps/web/public/art:/reader-art:ro
      - knowledge-archive:/var/lib/knowledge/archive
    restart: unless-stopped
    environment:
      <<: *database
      EPISODE_PLAN_DIR: /episode-plans
      MEDIA_WORKER_ENABLED: ${MEDIA_WORKER_ENABLED:-false}
      KNOWLEDGE_RESEARCH_URL: http://research-agent:4312
      GITHUB_TOKEN: ${KNOWLEDGE_GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      research-agent:
        condition: service_healthy
volumes:
  knowledge-data:
  research-state:
  media-assets:
  knowledge-archive:
