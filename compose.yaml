name: tidepost-knowledge
services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: anime
      POSTGRES_DB: anime_knowledge
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - knowledge-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${KNOWLEDGE_PG_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL","pg_isready -U anime -d anime_knowledge"]
      interval: 5s
      timeout: 3s
      retries: 12
  api:
    build: ./apps/api
    restart: unless-stopped
    environment:
      <<: &database
        PGHOST: postgres
        PGDATABASE: anime_knowledge
        PGUSER: anime
        PGPASSWORD: ${POSTGRES_PASSWORD}
        DATABASE_URL: "postgresql:///?sslmode=disable"
        KNOWLEDGE_ARCHIVE_DIR: /var/lib/knowledge/archive
      KNOWLEDGE_ADMIN_TOKEN: ${KNOWLEDGE_ADMIN_TOKEN:-}
      KNOWLEDGE_ADMIN_OPERATOR: ${KNOWLEDGE_ADMIN_OPERATOR:-}
      MATCH_AI_BASE_URL: ${MATCH_AI_BASE_URL:-}
      MATCH_AI_PROVIDER: ${MATCH_AI_PROVIDER:-openai}
      TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
      TYPESAFE_MODEL: ${TYPESAFE_MODEL:-jev-latest}
      MATCH_AI_MODEL: ${MATCH_AI_MODEL:-}
      MATCH_AI_API_KEY: ${MATCH_AI_API_KEY:-}
      API_HOST: 0.0.0.0
    volumes:
      - knowledge-archive:/var/lib/knowledge/archive
    ports:
      - "127.0.0.1:${KNOWLEDGE_API_PORT:-4321}:4311"
    depends_on:
      postgres:
        condition: service_healthy
  sync:
    build: ./apps/api
    command: ["knowledge-sync"]
    volumes:
      - knowledge-archive:/var/lib/knowledge/archive
    restart: unless-stopped
    environment:
      <<: *database
      GITHUB_TOKEN: ${KNOWLEDGE_GITHUB_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  knowledge-data:
  knowledge-archive:
